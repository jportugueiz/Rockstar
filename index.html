<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon192.png"><meta name="theme-color" content="#0b0a0a"><style>html,body{margin:0;padding:0;height:100%}</style></head><body><meta charset="utf-8">
<title>Rockstar App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Diapasón a lo ancho, teclas de acorde grandes del lado de la mano que arma acordes; barras finas arriba y abajo */
:root{
  --bg:#0b0a0a; --panel:#161414; --raise:#211e1d; --line:#2e2a28;
  --fg:#f4f1ec; --muted:#9b948d; --dim:#6a635d;
  --gold:#e3b86e; --gold2:#b8843f; --wine:#6b2b2b; --stage:#e8508a;
  --accent:var(--gold);
  --f-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Instrument Sans',system-ui,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --f-show:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --keysw:clamp(190px,27vw,340px);
  color-scheme:dark;
}
[hidden]{display:none!important}
.folder{grid-column:1/-1;border:1px solid var(--line);border-radius:14px;padding:6px 10px;background:var(--panel)}.folder>summary{cursor:pointer;font-weight:700;padding:8px 2px;list-style:none}.folder>summary small{color:var(--muted);font-weight:500}.folder[open]>summary{margin-bottom:6px}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:#060505;color:var(--fg);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#app{position:relative;z-index:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;height:100%;max-width:1500px;margin:0 auto;display:grid;
  grid-template-columns:minmax(0,1fr) var(--keysw);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "board keys" "bottom keys";gap:8px 14px;
  padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px));padding-block:8px 10px}
body.lefty #app{grid-template-columns:var(--keysw) minmax(0,1fr);grid-template-areas:"top top" "keys board" "keys bottom"}

/* Barra superior */
.top{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;min-height:52px}
.left{display:flex;align-items:center;gap:12px;min-width:0}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--fg)}
.ib:hover{background:var(--panel)}
.ib svg{width:24px;height:24px}
.ib[aria-pressed="true"]{color:var(--gold)}
.ib[aria-pressed="true"] svg .fillme{fill:var(--gold)}
#recBtn[aria-pressed="true"] .dot{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#bandBtn[aria-pressed="true"]{background:color-mix(in srgb,var(--gold) 16%,transparent)}
.song{min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.song b{font-family:var(--f-show);font-weight:800;font-size:25px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{display:flex;flex-direction:column;align-items:center;min-width:0}
.bigchord{font-family:var(--f-show);font-weight:900;font-size:clamp(40px,11vh,78px);line-height:.92;letter-spacing:.01em;white-space:nowrap;background:linear-gradient(180deg,#fff6e2 10%,#f0c77e 55%,#b9833c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(227,184,110,.35)) drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.bigchord .q{color:transparent}
.pos{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:2px}
.tools{display:flex;justify-content:flex-end;gap:2px}
.beats{display:flex;gap:6px;margin-top:5px;height:9px;align-items:center}
.beats i{width:9px;height:9px;border-radius:50%;background:#3d3835;transition:background .1s}
.beats i.on{background:var(--gold)}
.beats.due i{background:var(--gold);box-shadow:0 0 8px rgba(227,184,110,.8)}
.beats em{font-style:normal;font-size:12px;color:var(--gold);margin-left:4px;font-weight:600}
.key.next.ready{animation:ready .9s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 2px rgba(227,184,110,.5),0 0 48px rgba(227,184,110,.6);filter:brightness(1.2)}}
.right{display:flex;gap:8px;align-items:center;min-width:0}
.pill[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,#121010)}
#autoBtn{padding:0 14px}
#autoBtn,#instBtn,.pager{flex:none}
.right{flex:1 1 auto;justify-content:flex-end}
#chordBtn{min-width:0;flex:0 1 auto}
@media (max-width:980px){.modename{display:none}.pill{gap:8px}}
#autoBtn svg{width:22px;height:22px}

/* Diapasón (superficie de rasgueo) */
.board{grid-area:board;position:relative;border-radius:4px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:150px;box-shadow:0 12px 34px rgba(0,0,0,.7),0 0 46px rgba(227,184,110,.07)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:12px;right:12px;bottom:8px;text-align:center;font-size:12.5px;color:#f4f1ec;pointer-events:none;transition:opacity .6s;text-shadow:0 1px 4px #000}
.hint.gone{opacity:0}
.songbar{position:absolute;left:6px;right:6px;top:5px;height:6px;display:flex;gap:3px;pointer-events:none;z-index:2}
.songbar i{flex:var(--w) 1 0;border-radius:3px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
.songbar i b{position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--gold)}
#nextBtn.goNow{background:#c81e32!important;border-color:#ff5a6a!important;color:#fff!important;box-shadow:0 0 0 3px rgba(255,70,90,.45),0 0 28px rgba(255,40,60,.75)!important;animation:goP .8s ease-in-out infinite}#nextBtn.goNow.wait{animation-duration:.45s}#nextBtn.goNow *{color:#fff!important}@keyframes goP{50%{box-shadow:0 0 0 7px rgba(255,70,90,.15),0 0 40px rgba(255,40,60,.95)}}
.bandPill{flex:none;height:40px;padding:0 14px 0 10px;margin-right:6px;border-radius:999px;border:1px solid rgba(255,190,110,.6);background:linear-gradient(135deg,#ff6a3d,#e0475e 55%,#b0306a);color:#fff;font:800 15px system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(224,71,94,.45);white-space:nowrap;cursor:pointer}
.bandPill .bpIc{font-size:19px;line-height:1}.bandPill .bpDot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.bandPill[aria-pressed="true"]{background:linear-gradient(135deg,#ffb347,#ff6a3d 55%,#e0475e);animation:bpGlow 1.6s ease-in-out infinite}.bandPill[aria-pressed="true"] .bpDot{background:#5cff8a;box-shadow:0 0 8px #5cff8a}
@keyframes bpGlow{50%{box-shadow:0 4px 24px rgba(255,140,60,.8)}}
#bandBtn.bandPill[aria-pressed="true"]{background:linear-gradient(135deg,#ffb347,#ff6a3d 55%,#e0475e)}
.mbtn{border:0;height:40px;padding:0 11px;font:800 13px system-ui,sans-serif;background:#1c1714;color:#cfc6b8;white-space:nowrap}.mbtn[aria-pressed="true"]{background:var(--gold,#e3b86e);color:#1a1206}
.slist{display:flex;flex-direction:column;gap:6px}.slist .folder .slist{margin-top:6px}.card.scard{flex-direction:row;align-items:center;gap:6px;padding:0;border-radius:12px}.card.scard[aria-current="true"]{border-color:var(--gold)}.scard .sopen{flex:1;min-width:0;text-align:left;background:none;border:0;color:inherit;padding:12px 4px 12px 14px;display:flex;flex-direction:column;gap:2px;font:inherit;cursor:pointer}.scard .sopen b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scard .sopen small{opacity:.75}.card.scard .star{position:static;flex:none;padding:10px 12px}.scard .smode{flex:none;display:inline-flex;border-radius:999px;overflow:hidden;border:1px solid rgba(227,184,110,.5)}.scard .smode .mbtn{padding:9px 11px;font-size:13px;white-space:nowrap}.scard .sdel{flex:none;margin-right:8px;padding:6px 10px}
#hrecBtn[hidden]{display:none!important}#hrecBtn.on{background:#d8324a!important;animation:hrp 1.2s infinite}@keyframes hrp{50%{opacity:.7}}
.sectoast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:clamp(30px,10vh,64px);font-weight:700;color:#f4f1ec;text-shadow:0 2px 14px #000,0 0 4px #000;pointer-events:none;opacity:0;transition:opacity .7s;white-space:nowrap;z-index:2}
.sectoast.show{opacity:.95;transition:opacity .08s}

/* Teclas de acorde */
.keys{grid-area:keys;display:grid;grid-template-columns:42fr 58fr;gap:10px;min-height:0}
body.lefty .keys{grid-template-columns:58fr 42fr}
body.lefty #nextBtn{order:-1}
.key{position:relative;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--fg);touch-action:manipulation;transition:transform .08s,filter .12s;min-height:0;padding:10px 6px}
.key svg{width:clamp(34px,7vh,52px);height:clamp(34px,7vh,52px)}
.key .lbl{position:absolute;bottom:clamp(14px,6vh,34px);left:0;right:0;text-align:center;display:flex;flex-direction:column;gap:2px}
.key .lbl span{font-size:15px}
.key .lbl b{font-size:15px;font-weight:600;color:var(--gold);min-height:1.2em}
.key.prev{margin-block:18px 40px;background:linear-gradient(180deg,#1c1919,#0e0d0d);border:1.5px solid var(--wine);color:#d9d3cc}
.key.prev .lbl span{color:var(--muted)}
.key.next{background:linear-gradient(180deg,#5e4527 0%,#2b2116 42%,#151110 100%);border:2px solid var(--gold);box-shadow:0 0 0 1px rgba(227,184,110,.18),0 0 28px rgba(227,184,110,.22),inset 0 1px 0 rgba(255,255,255,.14)}
.key.next .lbl b{color:#fff3dc}
.key:active,.key.hit{transform:scale(.975);filter:brightness(1.3)}
.key[aria-disabled="true"]{opacity:.45}

/* Barra inferior */
.bottom{grid-area:bottom;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px}
.pill{display:flex;align-items:center;gap:12px;height:46px;padding:0 16px 0 14px;border-radius:999px;background:#121010;border:1px solid var(--line);min-width:0}
.pill svg{width:26px;height:26px;flex:none}
.pill .chev{width:16px;height:16px;color:var(--muted)}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
#chordPill{font-weight:600;font-size:17px}
.pager{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:4px}
.dots button{width:22px;height:30px;display:grid;place-items:center}
.dots button i{width:9px;height:9px;border-radius:50%;background:#3d3835;transition:background .2s}
.dots button[aria-selected="true"] i{background:#f4f1ec}
.modename{font-size:13px;color:var(--muted);min-width:64px}

@media (orientation:portrait){
  #app,body.lefty #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 140px auto;grid-template-areas:"top" "board" "keys" "bottom"}
  .key.prev{margin-block:10px}
  .song b{font-size:15px}.song span{font-size:12px}
}
@media (max-width:700px){.modename{display:none}.pill{padding:0 12px}.pill .chev{display:none}.tools .ib{width:38px}}

/* Hojas */
#micBtn[aria-pressed="true"]{background:color-mix(in srgb,var(--stage) 30%,transparent);box-shadow:0 0 0 2px var(--stage)}
.ivLab{position:absolute;left:10px;bottom:8px;font:600 12px var(--f-ui);color:var(--gold);background:rgba(0,0,0,.45);padding:3px 8px;border-radius:8px;pointer-events:none}.sgPad.iv{position:relative}
.instView.full{position:fixed;inset:0;z-index:12;background:#2a1b12;touch-action:none}.instView.full .ivSvg{position:absolute;left:0;right:0;top:52px;bottom:0;width:100%;height:calc(100% - 52px)}
.ivBar{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));background:linear-gradient(#0d0b0a,#16110e);border-bottom:1px solid rgba(227,184,110,.25);z-index:2}
.ivB{flex:none;height:38px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:#2a2420;color:#f4efe6;font:700 14px system-ui,sans-serif}.ivB.ivNext{background:#3a2f22;border-color:var(--gold)}.ivB.goNow{background:#c81e32;border-color:#ff5a6a;animation:goP .8s infinite}
.ivT{flex:1;min-width:0;font:700 15px system-ui,sans-serif;color:#f4efe6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instView.full .ivLab{bottom:10px}
.ivTx{font:700 13px system-ui,sans-serif;fill:#f1dfb0;letter-spacing:2px;opacity:.75}
.ivMove{transform-box:fill-box;transform-origin:center}
.ivCym.hit .ivMove{animation:cymW 1.25s cubic-bezier(.2,.6,.3,1)}@keyframes cymW{0%{transform:none}8%{transform:rotate(-7deg) scale(.95,1.03)}25%{transform:rotate(5deg) scale(1.03,.97)}45%{transform:rotate(-3deg) scale(.985,1.015)}65%{transform:rotate(1.5deg)}100%{transform:none}}
.ivP.hit .ivHi{animation:ivHiF .45s ease-out}@keyframes ivHiF{0%{opacity:.5}100%{opacity:0}}
.ivDr.hit .ivMove{animation:drH .24s}@keyframes drH{30%{transform:scale(.955)}100%{transform:none}}
.ivKey .ivMove{transform-box:view-box;transform-origin:50% 0}.ivKey.hit .ivMove{animation:kyH .28s}@keyframes kyH{20%{transform:translateY(6px);filter:brightness(.88)}100%{transform:none}}
.ivStr .ivMove{transform-box:fill-box;transform-origin:center}.ivStr.vib .ivMove{animation:stV .7s linear}@keyframes stV{0%{transform:none}8%{transform:translateY(3px)}16%{transform:translateY(-3px)}24%{transform:translateY(2.4px)}32%{transform:translateY(-2px)}42%{transform:translateY(1.5px)}52%{transform:translateY(-1.1px)}64%{transform:translateY(.7px)}78%{transform:translateY(-.4px)}100%{transform:none}}
.instView{position:absolute;inset:0;z-index:3;background:#120f0e;touch-action:none;user-select:none;-webkit-user-select:none}.instView.pass{pointer-events:none}
.ivSvg{width:100%;height:100%;display:block}.ivHi{transition:opacity .18s}.ivKey.on .ivHi{opacity:.42;transition:none}.ivDrum.on .ivHi{opacity:.45;transition:none}.ivDrum.on{transform-box:fill-box;transform-origin:center;animation:ivHit .14s}@keyframes ivHit{50%{transform:scale(.97)}}
.instView.flash,.sgPad.flash{animation:ivFlash .16s ease-out}@keyframes ivFlash{from{filter:brightness(1.5)}to{filter:none}}
.sgPad.iv{padding:0;overflow:hidden}.sgPad.iv .ivSvg{border-radius:20px}
#sesGuest{position:fixed;inset:0;z-index:30;background:#0b0a0a;display:flex;flex-direction:column;gap:12px;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow-y:auto}
.sgTop{display:flex;justify-content:space-between;align-items:center}
.sgNow{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.sgNow b{font-size:17px}.sgNow small{color:var(--muted)}
.sgInst{flex-wrap:wrap}
.sgPad{flex:1;min-height:260px;border-radius:22px;border:1px solid var(--gold2);background:radial-gradient(circle at 50% 40%,#2a2118,#120f0d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.sgPad span{font-size:64px;line-height:1}.sgPad b{font-family:var(--f-show);font-size:34px;text-transform:uppercase;letter-spacing:.04em}.sgPad small{color:var(--muted);max-width:28ch}
.sgPad.hit{animation:sgHit .18s ease-out}@keyframes sgHit{from{box-shadow:0 0 0 6px rgba(227,184,110,.45);background:#3a2c1c}to{box-shadow:none}}
.sgMic{display:flex;flex-direction:column;gap:8px}.sgMic small{color:var(--muted)}
.sesCode{font-family:var(--f-show);font-size:56px;letter-spacing:.25em;text-align:center;color:var(--gold);padding:6px 0;border:1px dashed var(--gold2);border-radius:14px}
#sheetWrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:relative;width:min(760px,100%);max-height:92%;display:flex;flex-direction:column;background:#141212;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.sheet h2{margin:0;font-family:var(--f-show);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.03em}
#sheetBody{overflow-y:auto;padding:4px 18px 22px;display:flex;flex-direction:column;gap:18px}
#sheetBody>*{flex-shrink:0}   /* sin esto las listas del menú se aplastaban hasta desaparecer */
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item[aria-current="true"]{background:var(--raise);box-shadow:inset 3px 0 0 var(--gold)}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.item .main b{font-weight:600}
.item .main small{color:var(--muted);font-size:12.5px}
.item .go{color:var(--muted);font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line);text-align:left;position:relative}
.card[aria-current="true"]{border-color:var(--gold)}
.card b{font-size:17px;font-weight:600;padding-right:34px}
.card small{color:var(--muted)}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.card .star{position:absolute;top:8px;right:8px}
.card .playbtn{margin-top:6px;align-self:flex-start}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.star{font-size:20px;color:var(--dim);padding:4px 6px;line-height:1}
.star[aria-pressed="true"]{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.preset{padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:left;font-weight:600}
.preset small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.preset[aria-pressed="true"]{border-color:var(--gold);background:var(--raise)}
.fx{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--bg);border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx .head{display:flex;align-items:center;gap:10px}
.fx .head .main{flex:1;min-width:0}
.fx .head .main small{display:block;color:var(--muted);font-size:12px}
input[type=range]{width:100%;accent-color:var(--gold)}
.toggle{display:flex;align-items:center;gap:8px;padding:2px;border-radius:12px;flex:none}
.toggle::before{content:"";width:40px;height:24px;flex:none;border-radius:12px;background:#3a3532;transition:background .15s;background-image:radial-gradient(circle at 12px 12px,#f4f1ec 8.5px,transparent 9px)}
.toggle[aria-pressed="true"]::before{background-color:var(--gold);background-image:radial-gradient(circle at 28px 12px,#1a1410 8.5px,transparent 9px)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 8px;border-radius:8px;color:var(--muted);font-weight:500;min-width:max-content}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 -2px 0 var(--gold)}
.seg button small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.keyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.keyrow b{font-size:28px;font-weight:600;min-width:64px;text-align:center}
.chart{display:flex;flex-direction:column;gap:10px}
.chart .sec{display:flex;flex-direction:column;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.pad{padding:8px 11px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-weight:600;min-width:44px}
.chips button[aria-current="true"],.pad[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--raise)}
.pchip{display:flex;align-items:center;border-radius:9px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.pchip button{padding:8px 11px;font-weight:600}
.pchip button.x{color:var(--dim);border-left:1px solid var(--line);padding:8px 9px}
.pchip.cur{border-color:var(--gold)}
.ghost{padding:8px 12px;border-radius:9px;border:1px dashed var(--line);color:var(--muted)}
.save{display:flex;gap:8px}
.field{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{padding:10px 16px;border-radius:11px;background:var(--gold);color:#1a1410;font-weight:600;flex:none}
.btn.big{padding:14px 18px;font-size:16px;width:100%}
.btn.quiet{background:var(--raise);color:var(--fg);border:1px solid var(--line)}
.setting{display:flex;flex-direction:column;gap:6px}
.setting label{display:flex;justify-content:space-between;font-size:14px}
.setting label span{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.meter{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.meter b{color:var(--fg);font-weight:500}
.p{margin:0;color:var(--muted);line-height:1.5;max-width:64ch;font-size:14px}
.rec{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec audio{width:100%;height:36px}
.rec .head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.calbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:6px;align-items:center;padding:6px 6px 6px 14px;border-radius:14px;background:rgba(12,10,10,.88);border:1px solid var(--gold);box-shadow:0 6px 24px rgba(0,0,0,.6);white-space:nowrap;max-width:calc(100% - 20px);overflow-x:auto}
.calbar span{font-size:13px;color:var(--fg);margin-right:4px}
.calbar button{padding:7px 11px;border-radius:9px;background:var(--raise);border:1px solid var(--line);font-size:13px;font-weight:600}
.calbar button.on{background:var(--gold);color:#1a1410;border-color:var(--gold)}
.tabin{width:100%;min-height:170px;font-family:var(--f-mono);font-size:12.5px;line-height:1.35;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);white-space:pre;overflow:auto;resize:vertical}
.prev{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.5}
.prev b{color:var(--gold);font-weight:500}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--bg)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.field{flex:none;padding:7px 8px;font-size:13px}
.part{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line)}
.part:first-child{border-top:0}
.part .main b{font-weight:600}.part .main small{display:block;color:var(--muted);font-size:12.5px}
.part input{grid-column:2}

/* Aviso de giro */
#rotate{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#rotate h2{margin:0;font-weight:700;font-size:26px}
.phone{width:58px;height:100px;border:3px solid var(--fg);border-radius:12px;position:relative;animation:turn 2.4s ease-in-out infinite}
.phone::after{content:"";position:absolute;left:50%;bottom:6px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--fg)}
@keyframes turn{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const DEMO={on:false,timer:null,t0:0,b0:0};const HREC={on:false,mode:null,t0:0,st:[],pt:[],ev:[],timer:null,lim:300,g:null,last:null,msg:''};
function demoBtn(){const b=$('#soloBtn');if(b)b.textContent=DEMO.on?'■ Parar':'▶ Tocar sola'}
function demoStop(){DEMO.on=false;clearInterval(DEMO.timer);demoBtn()}
function demoStart(){
  ensureAudio();if(!stepOn()){flashMsg('Esta canción no tiene acordes para tocar sola');return}stepBuild();const E=STEP.ev;if(!E.length)return;
  MB.on=false;clearInterval(MB.timer);if(idx!==MB.idx){const e0=E[STEP.st[idx]];mbSeek(e0?Math.floor(e0.b):0);MB.idx=idx}
  if(MB.ei>=E.length){mbSeek(0);idx=0;MB.idx=0}
  DEMO.on=true;DEMO.t0=ctx.currentTime+.08;DEMO.b0=MB.pos;demoBtn();clearInterval(DEMO.timer);curVel=.72;
  DEMO.timer=setInterval(()=>{if(!DEMO.on)return;const now=ctx.currentTime,spb=1/mbOrig();
    while(MB.ei<E.length){const e=E[MB.ei],t=DEMO.t0+(e.b-DEMO.b0)*spb;if(t>now+.3)break;MB.ei++;playEv(e,Math.max(now,t),1,spb);
      animAt(Math.max(now,t),()=>{if(DEMO.on&&idx!==e.ii){idx=e.ii;MB.idx=idx;render()}})}
    MB.pos=DEMO.b0+(now-DEMO.t0)/spb;
    if(MB.ei>=E.length){demoStop();mbSeek(0);idx=0;MB.idx=0;render()}},25);
  flashMsg('La guitarra toca sola · pasa la mano para tomar el control');
}
// tomas el control: la canción sigue desde donde iba, a la velocidad original, y desde ahí la lleva tu mano
function demoHand(){const spb=1/mbOrig(),now=ctx.currentTime;demoStop();MB.pos=Math.max(MB.pos,DEMO.b0+(now-DEMO.t0)/spb);MB.limit=MB.pos;MB.rate=1/spb;MB.k=null;MB.passes=[];MB.last=0}
$('#soloBtn').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();DEMO.on?demoStop():demoStart()});
function figReset(){delete FIGS[S.songId];store.set('figs',FIGS);LRN.t=[];STEP.key=null;render();flashMsg('Tócala como la sientes: en unos segundos aprendo tu ritmo')}
function stepOn(){return seq&&seq.type==='chords'&&S.mode!=='libre'&&!teach.on}
/* Cajita musical: la canción ya está escrita (ritmo original, silencios, acordes); tu mano es la manilla.
   Moverla hace avanzar la canción a la velocidad de tu mano (entre 0,5x y 1,5x del original) y con su fuerza.
   Si paras, el último acorde suena natural y la canción espera donde quedó. */
const MB={on:false,pos:0,p0:0,t0:0,rate:0,k:null,passes:[],last:0,vel:.7,ei:0,timer:null,idx:-1,limit:0};
const mbOrig=()=>(gpOn()?gpOn().bpm:lnotesOn()&&origs[S.songId]&&origs[S.songId].bpm||song().bpm||100)/60;                                   // tiempos por segundo del original
const mbPosAt=t=>MB.p0+(t-MB.t0)*MB.rate;
function mbAnchor(t,rate){MB.p0=MB.on?mbPosAt(t):MB.pos;MB.t0=t;MB.rate=rate}
function mbSeek(beat){const E=STEP.ev;let j=E.findIndex(e=>e.b>=beat-1e-6);MB.ei=j<0?E.length:j;MB.pos=beat;MB.p0=beat}
function mbPass(vel,dir){
  ensureAudio();if(seq.type!=='chords'||!seq.items.length)return;stepBuild();const E=STEP.ev;if(!E.length)return;
  const now=ctx.currentTime;if(now-MB.last<.045)return;
  // esperando al final de la parte: suena el último acorde; si ya tocaste Siguiente, la canción sigue con esta pasada
  if(MB.hold&&idx===MB.idx){if(MB.go&&loopOn()&&MB.sec<UN().length-1){vampStop();MB.hold=false;MB.go=false;MB.sec++;if(S.auto)flashMsg('▶ '+UN()[MB.sec].name);render()}
    else if(loopOn()){MB.last=now;mbVamp(dir,vel);seenHint();return}else MB.hold=false}
  if(MB.key!==STEP.key){MB.key=STEP.key;mbSeek(MB.pos)}
  // si cambiaste de parte con Anterior/Siguiente, la manilla sigue desde ahí
  if(idx!==MB.idx){MB.hold=false;MB.on=false;clearInterval(MB.timer);const e0=STEP.ev[STEP.st[idx]];mbSeek(MB.seekB!=null?MB.seekB:STEP.cum&&STEP.cum[idx]!=null?STEP.cum[idx]:e0?Math.floor(e0.b):0);MB.limit=MB.pos;MB.idx=idx;MB.sec=MB.seekB!=null?MB.sec:unIdx(idx);MB.seekB=null;MB.go=false}
  if(MB.sec==null)MB.sec=unIdx(idx);
  const dt=MB.last?now-MB.last:null;MB.last=now;MB.vel=MB.vel*.6+(vel==null?.7:vel)*.4;
  {const my=S.myInst||'g';if(my!=='g'&&A.dyn&&A.dyn[my])A.dyn[my].gain.setTargetAtTime(.6+.6*MB.vel,now,.1)}   // tu fuerza también manda en tu instrumento
  const mean0=MB.passes.length?MB.passes.reduce((a,v)=>a+v,0)/MB.passes.length:null;
  if(dt!=null&&dt<1.2){if(!(mean0&&MB.passes.length>=4&&dt<mean0*.35))MB.passes.push(dt)}else{MB.passes=[];MB.np=0;MB.base=0}   /* un temblor o rebote de la mano no cuenta como pasada */
  if(MB.passes.length>12)MB.passes.shift();curVel=clamp(vel==null?.72:.45+.6*vel,.4,1);
  const orig=mbOrig();let rate=MB.rate||orig;
  if(MB.passes.length>=2){const med=MB.passes.reduce((a,v)=>a+v,0)/MB.passes.length,pr=1/med;
    // Tu mano tiene SU velocidad natural, que no tiene por qué calzar con los tiempos de la canción.
    // Las primeras pasadas (~1,5 s) definen "tu normal" = la canción a su velocidad original.
    // Después: si vas un poco más rápido o lento, la canción te sigue suave (máx ±20 %).
    // Si cambias mucho y se mantiene (al doble, a la mitad…), se entiende como otra forma de tocar lo mismo: tu nuevo normal, sin cambiar la canción.
    MB.np=(MB.np||0)+1;const last4=MB.passes.slice(-4),prS=last4.length/last4.reduce((a,v)=>a+v,0);
    // "tu normal" se va ajustando despacio (unos 3 s): la canción vuelve sola a su velocidad original; los empujones cortos la mueven un poco
    // calentamiento: las primeras ~8 pasadas la canción va a su velocidad original mientras aprende tu normal (promedio simple, no se deja llevar por el arranque)
    if(!MB.base||MB.np<=8)MB.base=pr;else MB.base=MB.base*.94+pr*.06;
    const r=prS/MB.base,big=r>1.6||r<.62;MB.off=big?(MB.off||0)+1:0;
    if(MB.off>=4){MB.base=prS;MB.off=0;MB.passes=MB.passes.slice(-4)}
    MB.k=+(MB.base/orig).toFixed(2);
    // te alejas mucho de tu ritmo (más rápido o más lento de lo que la canción sigue): el teléfono vibra, más fuerte mientras más te alejas
    if(MB.np>8){const dv=Math.abs(Math.log(r)),th=Math.log(1.32);if(dv>th&&S.vib!==false){const k=Math.min(1,(dv-th)/Math.log(1.45));MB.vibS=k;
        try{if(navigator.vibrate&&now-(MB.vibT||0)>.12){navigator.vibrate(Math.round(10+40*k));MB.vibT=now}}catch(e){}}else MB.vibS=0}
    const target=MB.np<=8?orig:orig*clamp(Math.pow(big?1:r,.7),.75,1.25);/* la canción te sigue entre 75 % y 125 % de su velocidad */rate=MB.on?MB.rate*.85+target*.15:target}
  const prNow=MB.passes.length?MB.passes.length/MB.passes.reduce((a,v)=>a+v,0):0,step=prNow?rate/prNow*1.3:.5;   // cada pasada da cuerda para lo que dura una pasada (con margen), así nunca tartamudea                        // cuánto de la canción "gira" con cada pasada (sin saber aún: medio tiempo)
  const cur=MB.on?mbPosAt(now):MB.pos;
  // la manilla nunca deja que la canción se adelante a la mano: cada pasada da cuerda para un pedacito
  let lim=Math.max(MB.limit||0,cur)+step;lim=Math.min(lim,cur+step*1.6);   // si paras, la canción para en menos de una pasada y media
  if(!MB.on){
    // detenida: si justo toca un silencio, salta al siguiente rasgueo para que la pasada suene al tiro
    const nx=E[MB.ei],L=mbLoop();if(nx&&nx.b>=lim-1e-6&&nx.b-cur<4&&!(L&&nx.b>=L.b-1e-6)){MB.pos=nx.b;lim=nx.b+step}
    MB.limit=lim;MB.on=true;MB.p0=MB.pos;MB.t0=now+.005;MB.rate=rate;clearInterval(MB.timer);MB.timer=setInterval(mbTick,20);mbTick()}
  else{MB.limit=lim;mbAnchor(now,rate)}
  seenHint();
}
/* Sin Auto, la canción se queda esperando al final de la parte que tocas: cada pasada de tu mano vuelve a sonar
   solo el último acorde (o la última nota), como un guitarrista que guitarrea mientras espera entrar. Siguiente = sigue la canción.
   Con Auto, la canción sigue sola de parte en parte. */
function loopOn(){return !!(S.repeat||!S.auto)&&seq.type==='chords'&&seq.sections.length>0}
function secIdx(i){const k=seq.sections.findIndex(s=>i>=s.start&&i<s.end);return k<0?0:k}
// la unidad que la canción toca y después espera: sin Auto, cada acorde (tú lo cambias con Siguiente, como un guitarrista); con Auto y «repetir sección», la parte
/* Sin Auto, la canción espera cuando cambia la armonía de verdad: compás a compás se mira el acorde que suena en el 1;
   los compases seguidos con el mismo acorde son una sola unidad (los acordes de paso o de adorno dentro del compás no la cortan).
   Así una estrofa sobre un acorde suena entera, y la canción espera recién donde un guitarrista cambiaría de acorde. */
function UN(){if(!STEP.cum&&seq.items.length)stepBuild();const cum=STEP.cum||[0],tot=cum[cum.length-1]||0,key=STEP.key+'|'+S.auto;
  if(UN.k===key&&UN.c)return UN.c;UN.k=key;
  const itemAt=b=>{let lo=0,hi=seq.items.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(cum[m]<=b+1e-6)lo=m;else hi=m-1}return lo};
  let U;if(S.auto)U=seq.sections.map(sc=>({a:cum[sc.start],b:cum[sc.end],name:sc.name,start:sc.start}));
  else{const G=gpOn(),bars=G?G.bars.map(x=>x.start):Array.from({length:Math.ceil(tot/4)},(_,i)=>i*4);U=[];
    bars.forEach(a=>{if(a>=tot-1e-6)return;const ii=itemAt(a),ch=(seq.items[ii]||{}).chord||'',l=U[U.length-1];if(l&&l.ch===ch)return;U.push({a,ch,name:ch?disp(ch):'',start:ii})})}
  U.forEach((u,i)=>{u.b=i+1<U.length?U[i+1].a:tot;u.end=Math.min(seq.items.length,itemAt(Math.max(u.a,u.b-1e-3))+1)});return UN.c=U}
function unIdx(i){const U=UN(),b=(STEP.cum||[])[i]||0;let k=U.findIndex(u=>b>=u.a-1e-6&&b<u.b-1e-6);return k<0?0:k}
// una parte donde tu instrumento no toca (intro de sintetizadores de Tren al Sur) no espera: sigue hasta la primera parte que sí tocas
function unMine(u){const k=STEP.key+'|'+u.a+'|'+u.b;unMine.c=unMine.c||new Map();if(unMine.c.has(k))return unMine.c.get(k);const r=STEP.ev.some(e=>!e.band&&e.b>=u.a-1e-6&&e.b<u.b-1e-6);unMine.c.set(k,r);return r}
function mbLoop(){if(!loopOn()||!STEP.cum)return null;if(MB.sec==null)MB.sec=unIdx(idx);{const U=UN();while(MB.sec<U.length-1&&U[MB.sec]&&!unMine(U[MB.sec]))MB.sec++}const sc=UN()[MB.sec];if(!sc)return null;
  const a=sc.a,b=sc.b;return a!=null&&b!=null&&b>a?{a,b}:null}
function mbTick(){
  if(!MB.on||!ctx)return;const now=ctx.currentTime,E=STEP.ev;
  if(mbPosAt(now)>=MB.limit){MB.pos=MB.limit;MB.on=false;clearInterval(MB.timer);const L=mbLoop();if(L&&MB.pos>=L.b-1e-6&&!MB.go){MB.hold=true;render()}return}   // se acabó la cuerda: la canción espera aquí
  let until=Math.min(mbPosAt(now+.25),MB.limit);
  for(let g=0;g<6;g++){const L=mbLoop(),end=L?Math.min(until,L.b):until;
    while(MB.ei<E.length&&E[MB.ei].b<end-1e-6){const e=E[MB.ei++],t=Math.max(now,MB.t0+(e.b-MB.p0)/MB.rate);
      playEv(e,t+.001,.8+.3*MB.vel,1/(MB.rate||1));
      if(!e.band||STEP.ev[MB.ei]&&STEP.ev[MB.ei].ii!==e.ii)animAt(t,()=>{if(idx!==e.ii){idx=e.ii;MB.idx=idx;render()}})}
    if(!L||until<L.b-1e-6)break;
    if(MB.go&&MB.sec<UN().length-1){MB.go=false;MB.sec++;const nx=UN()[MB.sec];animAt(MB.t0+(L.b-MB.p0)/MB.rate,()=>{if(S.auto)flashMsg('▶ '+nx.name);render()});continue}   // tocaste Siguiente: al terminar la parte, sigue la que viene
    // fin de la parte: la canción se detiene aquí y espera; tus pasadas siguen sonando con el último acorde
    MB.limit=Math.min(MB.limit,L.b);if(mbPosAt(now)>=L.b-1e-6){MB.pos=L.b;MB.on=false;clearInterval(MB.timer);MB.hold=true;render()}break}
  if(MB.ei>=E.length&&!mbLoop()){MB.on=false;clearInterval(MB.timer);mbSeek(0);MB.limit=0;idx=0;MB.idx=0;MB.sec=0;flashMsg('¡Fin de la canción! Vuelve a empezar');render()}
}
// lo que suena mientras esperas: el último acorde de la parte (la rítmica), o si no hay acorde, la última nota
function mbVamp(dir,vel){const L=mbLoop();if(!L)return;const E=STEP.ev,now=ctx.currentTime+.004,v=clamp(.45+.6*(vel==null?.7:vel),.4,1),up=dir==='up';
  // si tocas bajo, teclado o batería, lo que suena mientras esperas es tu instrumento: su última nota (o un golpe de platillo)
  const my=S.myInst||'g';if(my!=='g'){let be=null;for(let j=MB.ei-1;j>=0&&E[j].b>=L.a-1e-6;j--)if(E[j].band&&E[j].band.k===my){be=E[j];break}
    if(my==='d'){drumHit(up?'h':'crash',now,up?.5:.8,up?42:49);drumHit('k',now,.8,36);return}
    if(be){const P=band.parts,o=[P.drums[0],P.bass[0],P.keys[0]];P.drums[0]=P.bass[0]=P.keys[0]=true;playBand(Object.assign({},be.band,{ns:be.band.ns.map(x=>Array.isArray(x)?[x[0],4,false]:x)}),now,1/(MB.rate||mbOrig()));[P.drums[0],P.bass[0],P.keys[0]]=o}return}
  let ch=null,one=null;for(let j=MB.ei-1;j>=0&&E[j].b>=L.a-1e-6;j--){const e=E[j];if(e.gp){if(!one)one=e;if(e.gp.ns.length>=3&&e.gp.role!=='solo'&&e.gp.role!=='mel'){ch=e;break}}else if(e.ev&&!one)one=e}
  const e=ch||one;MB.vel=MB.vel*.6+(vel==null?.7:vel)*.4;
  if(e&&e.gp){const ns=up?e.gp.ns.slice().sort((a,c)=>c.midi-a.midi).slice(0,Math.max(1,Math.min(4,e.gp.ns.length))):e.gp.ns;
    if(HREC.on)hrecEv(e,now,'espera');    MB.vampTr=e.gp.tr;   // suena entero, con su eco: no se corta hasta tu próxima pasada o hasta que avances
    playGp(Object.assign({},e.gp,{ns:ns.map(n=>Object.assign({},n,{dead:false,pm:false,dur:16,letRing:true})),brush:ch?(up?'Up':'Down'):null,dense:false,dur:16,dyn:'MF',gh:false}),now,.62+.5*MB.vel,1/(MB.rate||mbOrig()),Math.floor(L.b-1))}
  else{const it=seq.items[idx]||seq.items[UN()[MB.sec].end-1];if(it&&it.chord){const c=it.chord;fireEv([0,up?'TOP4':'ALL',up?'u':'d',v],c,roles(c),now)}}
  stage.flash=Math.min(1,stage.flash+.3)}
function vampStop(){if(MB.vampTr==null||!ctx)return;const t=ctx.currentTime+.03,p=MB.vampTr+':';Object.keys(GPV).forEach(k=>{if(k.startsWith(p)&&GPV[k]){stopVoice(GPV[k],t,.12);GPV[k]=null}});MB.vampTr=null}
function newEng(){return S.motor!=='old'}
/* ═════════ Forma de tocar «nueva» (por defecto; en Ajustes se puede volver a la anterior) ═════════
   La canción va con su reloj a su velocidad real mientras tu mano se mueva (si paras ~1,5 tiempos, espera).
   A · Guitar Hero/Rock Band: la guitarra de la partitura SIEMPRE suena a su tiempo; tu mano la «abre».
       Pasada cerca (hasta 0,17 s antes) = suena fuerte, con tu fuerza. Sin pasada = suena bajito.
       Notas muy seguidas (menos de 1/3 de tiempo entre ellas, como los ligados de Rock Band) siguen a la primera: una pasada toca la frase.
   B · Wii Music: cada nota tiene su espacio (de una nota a la siguiente). La primera pasada en ese espacio la toca:
       a tiempo si llegaste antes, o en el momento de tu pasada si llegaste un poco tarde. Sin pasada, ese espacio queda en silencio.
       Pasadas extra: un roce apagado de cuerdas (sin cortar lo que suena).
   Sonido: ataques con rampa corta (sin clics), el roce nunca corta las cuerdas que suenan, el límite de voces
   apaga primero las que ya se están apagando, y el reloj corre en un hilo aparte (no se atrasa si el teléfono se ocupa). */
const CL={st:[],sv:[],base:0,push:1,pend:null,dead:0,run:{},worker:null,ticker:null};
function clMode(){return 'A'}
function clSpeed(){return S.clSpeed||1}
function clTe(e){return MB.t0+(e.b-MB.p0)/MB.rate}
function clIOI(){const a=CL.st,d=[];for(let i=Math.max(1,a.length-9);i<a.length;i++){const x=a[i]-a[i-1];if(x<1)d.push(x)}if(!d.length)return .25;d.sort((x,y)=>x-y);return d[d.length>>1]}
function clSingle(e){const g=e.gp;return !!g&&(g.ns.length<=2||g.role==='solo'||g.role==='mel'||g.role==='lead')}
// reloj en un hilo aparte: el temporizador de la página se atrasa cuando el teléfono está ocupado; el de un Worker no
function clStartTicker(){clearInterval(MB.timer);MB.timer=null;
  try{if(!CL.worker){const u=URL.createObjectURL(new Blob(['let t=null;onmessage=e=>{clearInterval(t);if(e.data>0)t=setInterval(()=>postMessage(0),e.data)}'],{type:'text/javascript'}));CL.worker=new Worker(u);CL.worker.onmessage=()=>clTick()}
    CL.worker.postMessage(8);CL.ticker='w'}catch(e){CL.ticker=null;MB.timer=setInterval(clTick,8)}}
function clStopTicker(){try{CL.worker&&CL.worker.postMessage(0)}catch(e){}clearInterval(MB.timer)}
/* muestra fogata: golpe extra de tu mano entre los golpes del disco
   · donde se rasguea: el acorde entero (abajo o arriba según tu mano), más suave que los golpes del disco
   · donde la guitarra hace un riff sin rasgueo: solo un roce apagado, para no tapar la melodía
   · como mucho dos golpes extra entre cada golpe del disco, y siempre a tempo: en la semicorchea siguiente de la canción */
const FOGX={ei:-1,n:0,t:0};
function fogExtra(dir,vel,now){const E=STEP.ev,pos=mbPosAt(now),G=gpOn();if(FOGX.ei!==MB.ei){FOGX.ei=MB.ei;FOGX.n=0}if(FOGX.n>=2)return;
  // a tempo: el golpe extra cae en la próxima semicorchea de la canción (corchea si la canción es rápida), nunca encima de un golpe del disco
  const u=mbOrig()*60*clSpeed()>140?.5:.25;let q=Math.ceil((pos-.03)/u)*u;if(q<pos-.03)q+=u;
  if(FOGX.q!=null&&Math.abs(FOGX.q-q)<.01)return;   // ese espacio ya tiene su golpe extra
  for(let j=Math.max(0,MB.ei-6);j<Math.min(E.length,MB.ei+12);j++){const x=E[j];if(x.gp&&Math.abs(x.b-q)<.06&&x.gp.brush)return}
  const t=Math.max(now+.002,MB.t0+(q-MB.p0)/MB.rate);if(t-now>.2)return;
  const bar=G&&G.bars.find(B=>B.start<=q+1e-6&&B.start+(B.len||4)>q+1e-6),r=Math.round((q-(bar?bar.start:0))/u),gdir=r%2?'up':'down';
  let riff=null;for(let j=Math.min(E.length,MB.ei)-1;j>=0&&j>MB.ei-80;j--){const x=E[j];if(x.band||!x.gp)continue;if(pos-x.b>2.5)break;const g=x.gp;
    if(g.brush){const ch=(seq.items[x.ii]||{}).chord;if(!ch)return;let ns=chordMidis(ch).map((m,i)=>m==null?null:{midi:m,str:i,fret:0,dur:.5}).filter(Boolean);if(gdir==='up')ns=ns.slice(-4);if(!ns.length)return;
      FOGX.n++;FOGX.q=q;playGp(Object.assign({},g,{ns,brush:gdir==='up'?'Up':'Down',gh:false,dense:false,ac:false,dyn:'MF'}),t,.42+.25*(vel==null?.6:vel),1/MB.rate,q);return}
    if(g.role==='main'){riff=x;break}}   // los punteos (solo, melodía) no cuentan: debajo de ellos se sigue rasgueando
  if(riff){FOGX.n++;FOGX.q=q;const ns=riff.gp.ns.slice().sort((a,c)=>c.midi-a.midi).slice(0,3);ns.forEach((n,i)=>{const w=t+.003+i*.006,vv=voice(n.midi,{when:w,vel:clamp(.16+.2*(vel==null?.6:vel),.1,.4),dir:gdir,mul:.3,bank:'kam',dest:A.gpBus?rigIn('fog',0):null,soft:.002});stopVoice(vv,w+.06,.02)})}}
// roce: la mano pasa por las cuerdas agudas apagadas; voces aparte, NO corta las cuerdas que están sonando

/* ───────── Lector de tablaturas (ASCII) → solo por tiempos ───────── */
function parseTab(txt,upb){
  const out={notes:0,beats:[],bends:0,vibs:0,first:'',firstMidi:64};
  if(!txt||!txt.trim())return out;
  const lines=String(txt).replace(/\t/g,'    ').split(/\r?\n/);
  const isTab=l=>(l.match(/-/g)||[]).length>=4&&/^\s*[A-Ga-g]?[#b]?\s*[|:]?[-0-9hpbrv~\/\\|x()\s]*$/.test(l)&&/[-]{2}/.test(l);
  const blocks=[];let cur=[];
  const flush=()=>{for(let i=0;i+6<=cur.length;i+=6)blocks.push(cur.slice(i,i+6));cur=[]};
  lines.forEach(l=>{if(isTab(l))cur.push(l);else flush()});flush();
  if(!blocks.length)return out;
  const ev=[];let off=0;
  blocks.forEach(b=>{
    const rows=b.map(l=>l.replace(/^\s*[A-Ga-g]?[#b]?\s*/,'').replace(/^[|:]/,''));
    const W=Math.max(...rows.map(r=>r.length));
    rows.forEach((row,r)=>{const str=5-r;
      for(let c=0;c<row.length;c++){const ch=row[c];if(!/[0-9]/.test(ch))continue;
        let n=ch,c2=c;if(/[0-9]/.test(row[c+1]||'')&&+(ch+row[c+1])<=24){n=ch+row[c+1];c2=c+1}
        let art,k=c2+1;const t=row[k]||'';
        if(t==='b'){art='b';k++;while(/[0-9]/.test(row[k]||''))k++;if(row[k]==='r'){k++;while(/[0-9]/.test(row[k]||''))k++}}
        else if(t==='~'||t==='v')art='v';
        const prev=row[c-1]||'';if(prev==='h'||prev==='p'||prev==='/'||prev==='\\')art=art||'h';
        ev.push({col:off+c,midi:TUNING[str]+(+n),art});c=Math.max(c2,k-1);
      }});
    off+=W+2;
  });
  if(!ev.length)return out;
  const byCol=new Map(),allCol=new Map();ev.forEach(e=>{const o=byCol.get(e.col);if(!o||e.midi>o.midi)byCol.set(e.col,e);if(!allCol.has(e.col))allCol.set(e.col,[]);allCol.get(e.col).push(e)});
  const notes=[...byCol.values()].sort((a,b)=>a.col-b.col);
  const gaps=[];for(let i=1;i<notes.length;i++)gaps.push(notes[i].col-notes[i-1].col);
  const sg=gaps.slice().sort((a,b)=>a-b),unit=Math.max(1,sg.length?sg[Math.floor(sg.length*.25)]:2);
  let pos=0;const units=notes.map((n,i)=>{const p=pos;pos+=i<gaps.length?clamp(Math.round(gaps[i]/unit),1,8):2;return p});
  const per=upb==='auto'?2:+upb;
  out.events=notes.map((n,i)=>({pos:units[i]/per,midis:[...new Set(allCol.get(n.col).map(e=>e.midi))].sort((a,b)=>a-b),art:n.art,dur:((i+1<notes.length?units[i+1]:pos)-units[i])/per}));
  const nb=Math.ceil((pos+.001)/per),beats=[];
  for(let b=0;b<nb;b++){
    const inBeat=notes.map((n,i)=>({n,u:units[i]})).filter(x=>x.u>=b*per&&x.u<(b+1)*per);
    if(!inBeat.length){beats.push('-');continue}
    const slots=new Array(per).fill(null);inBeat.forEach(x=>{slots[x.u-b*per]=x.n});
    const toks=[];let firstSet=false;slots.forEach(n=>{if(n){toks.push(n.midi+(n.art||''));firstSet=true}else if(firstSet)toks.push('-')});
    while(toks.length&&toks[toks.length-1]==='-')toks.pop();
    beats.push(toks.filter(t=>t!=='-').length===toks.length?toks.join(' '):toks.filter(t=>t!=='-').join(' '));
  }
  out.notes=notes.length;out.beats=beats;out.bends=notes.filter(n=>n.art==='b').length;out.vibs=notes.filter(n=>n.art==='v').length;
  out.firstMidi=notes[0].midi;out.first=notes.slice(0,8).map(n=>noteName(n.midi)+(n.art==='b'?'↑':n.art==='v'?'~':'')).join(' ');
  return out;
}

function parseMusicXML(txt){
  const out={notes:0,beats:[],bends:0,vibs:0,first:'',firstMidi:64,events:[]};
  let doc;try{doc=new DOMParser().parseFromString(txt,'application/xml')}catch(e){return out}
  const part=doc.querySelector('part');if(!part)return out;
  const STEP={C:0,D:2,E:4,F:5,G:7,A:9,B:11},evs=[];let div=1,pos=0,oct=0,chroma=0,lastStart=0;
  const num=(el,q)=>{const x=el.querySelector(q);return x?+x.textContent||0:0};
  part.querySelectorAll('measure').forEach(m=>{[...m.children].forEach(el=>{
    const tg=el.tagName;
    if(tg==='attributes'){const d=num(el,'divisions');if(d)div=d;if(el.querySelector('transpose')){oct=num(el,'transpose octave-change');chroma=num(el,'transpose chromatic')}}

      if(el.querySelector('grace'))return;
      const dur=num(el,'duration')/div,isChord=!!el.querySelector('chord'),start=isChord?lastStart:pos;
      if(!isChord){lastStart=pos;pos+=dur}
      if(el.querySelector('rest'))return;
      if(el.querySelector('tie[type="stop"]')&&!el.querySelector('tie[type="start"]')){const l=evs[evs.length-1];if(l)l.dur+=dur;return}
      let midi;const sf=el.querySelector('technical string'),fr=el.querySelector('technical fret');
      if(sf&&fr)midi=TUNING[6-(+sf.textContent)]+(+fr.textContent);

// el corte más cercano a un ataque real dentro de una ventana

// suena un pedazo: el pedazo exacto y, si tu siguiente golpe tarda, la cuerda sigue sonando y se apaga natural

/* ───────── Modo notas: tu mano solo marca el tempo; la guitarra toca las notas en su ritmo original ─────────
   Rasguear abajo y arriba no hace sonar nada por sí mismo: la app mide tu pulso (1x, 2x, 3x…), lo sigue suave
   y la guitarra va tocando exactamente lo que toca la canción, a tu velocidad. Si paras, la guitarra se detiene. */

/* ───────── Golpe a golpe: cada pasada de la mano (abajo o arriba) toca UN paso de la canción ─────────

function stepStroke(vel){
  ensureAudio();const now=ctx.currentTime,E=SL.events;if(!E||!E.length)return;vel=clamp(vel==null?.7:vel,.25,1);

      ord.forEach(si=>{const mm=ms[si];if(mm==null)return;        const vv=clamp((.3+.5*Math.pow(x[3],1.2))*(up?.8:1)*(.55+.55*vel),.15,.9),vc=voice(mm,{when:w+k*.008,vel:vv,mul:.62,dir:up?'up':'down',pan:(si-2.5)*.1,dest:FL.g});

    const [,m,,amp]=x,role=x[4]||'m',st=notePos(m).s,rg=role==='m'?1:role==='b'?.72:.42,vv=clamp((.25+.6*Math.pow(amp,1.3))*rg*(.6+.5*vel),.12,.9),mulx=role==='m'?.95:.8;

  clearTimeout(SL.stopT);SL.stopT=setTimeout(()=>{SL.on=false;render()},2500);
  if(!SL._rr||now-SL._rr>.2){SL._rr=now;const keep=$('#curName').textContent;origRender();if(e.items[0][4]==='c')$('#curName').textContent=keep}
}

function flowStroke(vel){
  ensureAudio();const now=ctx.currentTime,L=slLat(),o=origs[S.songId];vel=clamp(vel==null?.7:vel,.25,1);
  const dt=FL.last?now-FL.last:null,per=SL.iv&&SL.iv.length>=3?slPeriod():null;
  if(per&&dt!=null&&dt<per*.45)return;                 // golpe de más: no cambia nada
  if(FL.demo){FL.p=flowAt(now);FL.demo=false;FL.on=false;clearInterval(FL.timer)}
  FL.last=now;FL.vel=FL.vel*.7+vel*.3;SL.last=now;slLearn(dt);SL.on=true;
  const songR=flowSongRate();
  if(!FL.on){FL.on=true;FL.t0=now;FL.r=songR;FL.idx=0;while(FL.idx<SL.nB.length&&SL.nB[FL.idx]<FL.p-.01)FL.idx++;
    flowChain();FL.idx=0;while(FL.idx<SL.nB.length&&SL.nB[FL.idx]<FL.p-.01)FL.idx++;clearInterval(FL.timer);FL.timer=setInterval(flowTick,25);flowTick()}

// camino limpio: sin delay ni reverb de los efectos (eso hacía que cada pedazo se repitiera encima, desfasado)

// demo: la guitarra toca sola, al tempo original, para escuchar qué aprendió
function flowDemo(){

  if(SL.buf!=='notes'){slPrepare();flashMsg('Preparando las notas… vuelve a tocar Demo en un momento');return}
  FL.demo=true;FL.on=true;SL.on=true;FL.t0=ctx.currentTime+.05;FL.r=flowSongRate();flowChain();
  FL.idx=0;while(FL.idx<SL.nB.length&&SL.nB[FL.idx]<FL.p-.01)FL.idx++;clearInterval(FL.timer);FL.timer=setInterval(flowTick,25);flowTick();render()

  while(FL.idx<N.length&&SL.nB[FL.idx]<pEnd){const i=FL.idx++,b=SL.nB[i];
    let w=FL.t0+(b-FL.p)/FL.r-L;if(w<now)w=now;const dur=clamp((SL.nE[i]-b)/FL.r,.07,N[i][4]==='c'?2.2:1.4),[,m,,amp]=N[i],st=m>0?notePos(m).s:0;
    if(m>0&&NSV[st])stopVoice(NSV[st],w,.015);
    // mezcla con jerarquía: melodía adelante, bajo firme, relleno suave; ataque de cuerda suavizado
    if(N[i][4]==='c'){const ch=N[i][5],dn=N[i][6]!=='up',ms=chordMidis(ch),ord=dn?[0,1,2,3,4,5]:[5,4,3,2],ampc=N[i][3];let kk=0;
      ord.forEach(si=>{const mm=ms[si];if(mm==null)return;if(NSV[si])stopVoice(NSV[si],w+kk*.009,.015);
        const vv=clamp((.25+.55*Math.pow(ampc,1.2))*(dn?1:.7)*(.65+.45*FL.vel),.12,.85);const vc=voice(mm,{when:w+kk*.009,vel:vv,mul:.62,dir:dn?'down':'up',pan:(si-2.5)*.1,dest:FL.g});
        vc.g.gain.setTargetAtTime(0,w+dur,.12);NSV[si]=vc;const s2=si;animAt(w,()=>kick(s2,.5+.4*ampc));kk++});
      continue}
    const role=N[i][4]||'m',rg=role==='m'?1:role==='b'?.72:.42,vv=clamp((.22+.62*Math.pow(amp,1.3))*rg*(.65+.45*FL.vel),.12,.9),mulx=role==='m'?.95:.8;
    const v=voice(m,{when:w,vel:vv,mul:mulx,pan:role==='m'?0:(st-2.5)*.12,dest:FL.g});
    const pk=(.12+.3*vv)*mulx;v.g.gain.cancelScheduledValues(w);v.g.gain.setValueAtTime(0,w);v.g.gain.linearRampToValueAtTime(pk,w+.007);v.g.gain.setTargetAtTime(pk*.55,w+.05,.25);
    v.f.frequency.setValueAtTime(role==='m'?5200:role==='b'?1600:2400,w);
    v.g.gain.setTargetAtTime(0,w+dur,.08);NSV[st]=v;const ss=st;animAt(w,()=>kick(ss,.6+.4*amp))}
  SL.pos=flowAt(now);if(!FL._r||now-FL._r>.25){FL._r=now;origRender();const it=N[FL.idx-1];if(it&&it[4]==='c')$('#curName').textContent=disp(it[5])}if(SL.pos>=origs[S.songId].beats.length-1){FL.on=false;FL.demo=false;FL.p=0;FL.idx=0;clearInterval(FL.timer);flashMsg('¡Fin de la canción!')}
}

// modo notas (pedazos): nuestra guitarra toca las notas aprendidas de este pedazo, repartidas en el tiempo de tu golpe
const NSV=[null,null,null,null,null,null];

  const T=SL.nT,N=SL.notes;let lo=0,hi=T.length;while(lo<hi){const m=(lo+hi)>>1;if(T[m]<a)lo=m+1;else hi=m}
  const span=Math.max(.04,b-a),userIv=SL.iv&&SL.iv.length>=2?slPeriod():span,sc=clamp(userIv/span,.45,2.6);
  const g=ctx.createGain();g.gain.value=gainMul;g.connect(A.instIn);
  for(let i=lo;i<N.length&&N[i][0]<b;i++){const [t,m,d,amp]=N[i],w=when+(t-a)*sc,dur=clamp(d*sc,.08,2.6),st=notePos(m).s;
    if(NSV[st])stopVoice(NSV[st],w,.02);
    const v=voice(m,{when:w,vel:clamp((.35+.75*amp)*(.6+.5*vel),.2,1),mul:1.25,pan:(st-2.5)*.08,dest:g});
    v.g.gain.setTargetAtTime(0,w+dur,.09);NSV[st]=v;const ss=st;animAt(w,()=>kick(ss,.6+.4*amp))}

function slMedian(){const s=SL.iv.slice().sort((x,y)=>x-y);return s[s.length>>1]}
// periodo de tu mano usando pares de golpes: así entiende el rasgueo con swing (abajo largo, arriba corto)
function slPeriod(m){const v=m?SL.iv.slice(-m):SL.iv;if(v.length<2)return v[0]||null;const pr=[];for(let i=1;i<v.length;i++)pr.push((v[i]+v[i-1])/2);pr.sort((x,y)=>x-y);return pr[pr.length>>1]}
function slStroke(vel){
  if(SL.buf==='notes'){(S.playStyle||'paso')==='paso'?stepStroke(vel):flowStroke(vel);return}
  if(!SL.buf||SL.id!==S.songId){slPrepare();flashMsg('Preparando la guitarra…');return}
  ensureAudio();const now=ctx.currentTime,o=origs[S.songId],B=o.beats;vel=clamp(vel==null?.7:vel,.25,1);
  const dt=SL.last?now-SL.last:null,med0=SL.iv.length>=3?slPeriod():null;
  // golpe extra (mucho más rápido que tu patrón): vuelve a atacar lo mismo, no adelanta la canción ni confunde tu patrón
  if(med0&&dt!=null&&dt<med0*.5&&SL.cur&&!(SL.preds&&SL.preds.length&&now>=SL.preds[0].fire-.02)){const c=SL.cur;slPlay(c.a,Math.min(c.b,c.a+.12),now,vel*.7,.6);stage.flash=Math.min(1,stage.flash+.15);return}

  const P=SL.preds||(SL.preds=[]),eps=1e-6;
  // ¿este golpe ya estaba anticipado? (la app lo lanzó antes para tapar el retraso del parlante)
  if(P.length&&Math.abs(P[0].pos-SL.pos)<eps&&(Math.abs(now-P[0].at)<P[0].win||(now>=P[0].fire-.02&&now<=P[0].at+P[0].late))){const p=P.shift();clearTimeout(p.to);p.pl.g.gain.setTargetAtTime(.55+.45*vel,Math.max(now,p.fire),.02);SL.pos+=1/SL.k;if(SL.seg)SL.seg.n++;if(SL.badFrom)SL.badFrom.n++;slLearn(dt);slAnticipate();stage.flash=Math.min(1,stage.flash+.3*vel);slAlive();return}
  if(P.length&&!(P[0].pos>SL.pos+eps&&now<P[0].at-P[0].win))slCancelPreds(now);
  slLearn(dt);

  if(!SL.k)SL.k=slGuessK(dt);

  if(med&&dt&&dt>med*1.6&&dt<med*3.6){const sk=Math.min(3,Math.round(dt/med)-1);if(sk>0)slCancelPreds(now);SL.pos+=sk/SL.k;if(SL.seg)SL.seg.n+=sk}

function slAlive(){clearTimeout(SL.stopT);const med=SL.iv.length>=3?slPeriod():.5;SL.stopT=setTimeout(()=>{SL.on=false;render()},Math.max(1500,med*4000));origRender()}
function slCancelPreds(now,onlyFuture){const keep=[];(SL.preds||[]).forEach(p=>{if(onlyFuture&&p.fire<=now+.005){keep.push(p);return}clearTimeout(p.to);clearTimeout(p.cut);try{const t=Math.max(now,p.fire);p.pl.g.gain.cancelScheduledValues(t);p.pl.g.gain.setValueAtTime(p.pl.g.gain.value||0,t);p.pl.g.gain.linearRampToValueAtTime(0,t+.04);p.pl.src.stop(t+.06);p.pl.sus.stop(t+.06)}catch(_){}});SL.preds=keep}
// aprende tu patrón: cuántos golpes das por cada pulso de la canción (½, 1, 2, 3 o 4)
function slGuessK(dt){const sb=slSongBeat();if(!dt||dt>1.6)return SL.kPrev||2;const c=[.5,1,2,3,4];return c.reduce((a,x)=>Math.abs(Math.log(sb/(dt*x)))<Math.abs(Math.log(sb/(dt*a)))?x:a,2)}
function slSongBeat(){const B=origs[S.songId].beats,i=Math.max(0,Math.min(B.length-9,Math.floor(SL.pos)));return (B[i+8]-B[i])/8}
function slBestK(iv){const sb=slSongBeat(),c=[.5,1,2,3,4];return c.reduce((a,x)=>Math.abs(Math.log(sb/(iv*x)))<Math.abs(Math.log(sb/(iv*a)))?x:a,2)}
function slSegReset(){SL.seg={start:SL.pos,n:0};SL.iv=[];SL.kBad=0;SL.fresh=true}
function slLearn(dt){
  if(dt==null){slSegReset();return}
  if(dt>2.5){SL.kPrev=SL.k||SL.kPrev;slSegReset();return}   // te detuviste: aprende de nuevo desde aquí
  // un golpe que se te pasó no cuenta como 'ir más lento': se mide como si hubieras tocado los que faltaron
  const pm=SL.iv.length>=3?slPeriod():null;if(pm&&dt>pm*1.6&&dt<pm*3.6){if((SL.longRun=(SL.longRun||0)+1)<=1)dt=dt/Math.round(dt/pm)}else SL.longRun=0;

  if(seg.n<=10&&SL.iv.length>=2){const nk=slBestK(slPeriod());if(nk!==SL.k){SL.k=nk;SL.pos=seg.start+seg.n/nk;slCancelPreds(ctx.currentTime)}SL.fresh=false;return}

  if(best!==SL.k&&cur>Math.log(1.3)&&alt+.1<cur){if(SL.kBad===0)SL.badFrom={pos:SL.pos,n:0};if(++SL.kBad>=3){slCancelPreds(ctx.currentTime);const bf=SL.badFrom||{pos:SL.pos,n:0};SL.pos=Math.round((bf.pos+bf.n/best)*best*4)/(best*4);SL.k=best;SL.kBad=0;SL.badFrom=null;SL.iv=SL.iv.slice(-2)}}else{SL.kBad=0;SL.badFrom=null}
}
// si vas parejo, la app lanza los próximos pedazos un poco antes, justo lo que tarda tu parlante,
// para que el sonido salga en el instante de tu golpe. Si el golpe no llega, el pedazo se apaga y la canción no avanza.
function slAnticipate(){

  // tu mano se predice por pares (golpe abajo / golpe arriba), así el swing también se anticipa bien

/* Decodificador de notas: mismo algoritmo que basic-pitch (output_to_notes_polyphonic), versión rápida */
// Versión rápida (mismo algoritmo que basic-pitch output_to_notes_polyphonic) con arreglos planos y montículo
function bpFastNotes(Fr,On,nT,onsetThresh,frameThresh,minLen,energyTol){
  const P=88,MAXF=87,fr=Fr,on=new Float32Array(On);
  // inferir ataques por subidas en la energía
  const diff=new Float32Array(nT*P);let dmax=0,omax=0;
  for(let t=0;t<nT;t++)for(let p=0;p<P;p++){const i=t*P+p;if(on[i]>omax)omax=on[i];if(t<2)continue;const d1=fr[i]-fr[i-P],d2=fr[i]-fr[i-2*P];let d=Math.min(d1,d2);if(d<0)d=0;diff[i]=d;if(d>dmax)dmax=d}
  // (filas 0 y 1: el original rellena con ceros antes de restar; replicamos)
  for(let p=0;p<P;p++){if(nT>1){}}
  if(dmax>0)for(let i=0;i<nT*P;i++){const v=omax*diff[i]/dmax;if(v>on[i])on[i]=v}
  const rem=new Float32Array(fr),notes=[];
  // máximos locales en el tiempo por encima del umbral, recorridos de atrás hacia adelante
  const peaks=[];for(let t=1;t<nT-1;t++)for(let p=0;p<P;p++){const i=t*P+p,v=on[i];if(v>=onsetThresh&&v>on[i-P]&&v>on[i+P])peaks.push(i)}
  for(let q=peaks.length-1;q>=0;q--){const t0=(peaks[q]/P)|0,f=peaks[q]%P;if(t0>=nT-1)continue;
    let i=t0+1,k=0;while(i<nT-1&&k<energyTol){if(rem[i*P+f]<frameThresh)k++;else k=0;i++}i-=k;
    if(i-t0<=minLen)continue;let s=0;
    for(let t=t0;t<i;t++){rem[t*P+f]=0;if(f<MAXF)rem[t*P+f+1]=0;if(f>0)rem[t*P+f-1]=0;s+=fr[t*P+f]}
    notes.push([t0,i,f+21,s/(i-t0)])}
  // truco "melodia": notas sin ataque claro, de la más fuerte a la más débil (montículo con borrado perezoso)
  const H=[];const push=(v,i)=>{H.push([v,i]);let c=H.length-1;while(c>0){const p=(c-1)>>1;if(H[p][0]>=H[c][0])break;[H[p],H[c]]=[H[c],H[p]];c=p}};
  const pop=()=>{const top=H[0],last=H.pop();if(H.length){H[0]=last;let c=0;for(;;){const l=2*c+1,r=l+1;let m=c;if(l<H.length&&H[l][0]>H[m][0])m=l;if(r<H.length&&H[r][0]>H[m][0])m=r;if(m===c)break;[H[m],H[c]]=[H[c],H[m]];c=m}}return top};
  for(let i=0;i<nT*P;i++)if(rem[i]>frameThresh)push(rem[i],i);
  while(H.length){const [v,idx]=pop();if(rem[idx]!==v||v<=frameThresh)continue;
    const tm=(idx/P)|0,f=idx%P;rem[idx]=0;
    let i=tm+1,k=0;while(i<nT-1&&k<energyTol){const j=i*P+f;if(rem[j]<frameThresh)k++;else k=0;rem[j]=0;if(f<MAXF)rem[j+1]=0;if(f>0)rem[j-1]=0;i++}
    const iEnd=i-1-k;
    i=tm-1;k=0;while(i>0&&k<energyTol){const j=i*P+f;if(rem[j]<frameThresh)k++;else k=0;rem[j]=0;if(f<MAXF)rem[j+1]=0;if(f>0)rem[j-1]=0;i--}
    const iStart=i+1+k;if(iEnd-iStart<=minLen)continue;
    let s=0;for(let t=iStart;t<iEnd;t++)s+=fr[t*P+f];notes.push([iStart,iEnd,f+21,s/(iEnd-iStart)])}
  // de cuadros a segundos (igual que el original)
  const FPS=Math.floor(22050/256),NF=FPS*2,NS=22050*2-256,WO=(256/22050)*(NF-NS/256)+.0018,ft=x=>x*256/22050-WO*Math.floor(x/NF);
  return notes.map(([a,b,m,amp])=>({startTimeSeconds:ft(a),durationSeconds:ft(b)-ft(a),pitchMidi:m,amplitude:amp}));
}

function bpWorkers(n){

// segunda limpieza al tocar: una guitarra clara, sin armónicos dobles ni ecos (no hace falta volver a aprender)
function bpRefine(N){
  const out=[];let i=0;
  while(i<N.length){let j=i;while(j<N.length&&N[j][0]-N[i][0]<.045)j++;
    const cl=N.slice(i,j).sort((a,b)=>b[3]-a[3]),keep=[];
    for(const x of cl){if(keep.some(k=>[12,19,24,31].includes(x[1]-k[1])&&x[3]<=k[3]*1.15))continue;if(keep.some(k=>k[1]===x[1]))continue;if(keep.length>=4)continue;keep.push(x)}
    keep.forEach(x=>out.push(x.slice()));i=j}
  out.sort((a,b)=>a[0]-b[0]);
  const res=[],last={};
  for(const x of out){const p=last[x[1]];
    if(p&&x[0]-p[0]<.12){p[2]=Math.max(p[2],x[0]+x[2]-p[0]);p[3]=Math.max(p[3],x[3]);continue}      // re-ataque pegado: una sola nota
    if(p&&x[0]-p[0]<.5&&x[3]<p[3]*.6)continue;                                                      // eco del efecto: más débil y repetido
    res.push(x);last[x[1]]=x}
  return res;
}
// nivel de detalle: Simple = melodía + bajo; Medio = + una nota del acorde; Completo = todo. Cada nota sabe su papel (m, b, f)
function bpLevel(N,level){
  const out=[];let i=0;
  while(i<N.length){let j=i;while(j<N.length&&N[j][0]-N[i][0]<.045)j++;
    const cl=N.slice(i,j),mx=Math.max(...cl.map(x=>x[3])),strong=cl.filter(x=>x[3]>=mx*.5).sort((a,b)=>b[1]-a[1]);
    const mel=strong[0],low=cl.slice().sort((a,b)=>a[1]-b[1])[0];
    out.push([...mel,'m']);
    if(low&&low!==mel&&low[1]<=mel[1]-7&&(level!=='simple'||low[1]<57))out.push([...low,'b']);
    if(level==='medio'){const mid=strong.find(x=>x!==mel&&x!==low&&Math.abs(x[1]-mel[1])>=3);if(mid)out.push([...mid,'f'])}
    if(level==='completo')cl.forEach(x=>{if(x!==mel&&x!==low)out.push([...x,'f'])});
    i=j}
  if(level!=='simple')return out;
  // Simple: como mucho una nota de melodía cada medio tiempo (la más fuerte) y un bajo por tiempo: se entiende y no se amontona
  const B=origs[S.songId]&&origs[S.songId].beats,bt=t=>B?origBeatAt(B,t):t*2.4,res=[];const slot={};
  out.forEach(x=>{const b=bt(x[0]),key=x[4]+'|'+(x[4]==='m'?Math.round(b*2):Math.round(b));const cur=slot[key];if(!cur||x[3]>cur[3])slot[key]=x});

// Acordes: la app deduce qué acorde suena en cada tiempo (por las notas que aprendió) y lo toca completo,

  const dur={};ch.forEach(c=>{if(c)dur[c]=(dur[c]||0)+1});const tot=Object.values(dur).reduce((a,v)=>a+v,0)||1;

  let V=K.set.filter(c=>(d2[c]||0)>=tot*.015||c===K.set[0]);Object.keys(d2).forEach(c=>{if(!V.includes(c)&&d2[c]>=tot*.08)V.push(c)});

    for(let a=0;a<n;a++){let bi=0,bv=-1e9;for(let z=0;z<n;z++){const v=prev[z]-(z===a?0:P);if(v>bv){bv=v;bi=z}}cur[a]=bv+scr(M[b],V[a]);bk[a]=bi}
    BK.push(bk);prev=cur}

  const slot={};let i=0;
  while(i<N.length){let j=i;while(j<N.length&&N[j][0]-N[i][0]<.045)j++;const cl=N.slice(i,j),amp=Math.max(...cl.map(x=>x[3])),b=bt[i],key=Math.round(b*2);

  const ev=Object.values(slot).sort((a,b)=>a[0]-b[0]);
  ev.forEach((e,k)=>{e[5]=ch[Math.max(0,Math.min(nb-1,Math.floor(e[7]+.05)))];const nx=ev[k+1];e[2]=Math.min(2.2,nx?nx[0]-e[0]+.25:1.5)});
  return ev.filter(e=>e[5]).map(e=>e.slice(0,7));
}
function slApplyLevel(){if(!SL.allNotes)return;const o=origs[S.songId];const lv=S.noteLevel||'acordes';SL.notes=lv==='acordes'?bpChords(SL.allNotes,o.beats):bpLevel(SL.allNotes,lv);SL.nT=SL.notes.map(x=>x[0]);SL.nOn=[...new Set(SL.nT.map(t=>+t.toFixed(2)))];

// limpieza: rango de guitarra, sin notas fantasma, máximo 6 cuerdas a la vez
function bpClean(raw){
  let n=raw.filter(x=>x.pitchMidi>=40&&x.pitchMidi<=88&&x.amplitude>=.25&&x.durationSeconds>=.05).map(x=>[+x.startTimeSeconds.toFixed(3),x.pitchMidi,+x.durationSeconds.toFixed(3),+x.amplitude.toFixed(2)]).sort((a,b)=>a[0]-b[0]);
  const out=[];for(const x of n){const dup=out.slice(-8).find(y=>y[1]===x[1]&&x[0]-y[0]<.06);if(dup){dup[3]=Math.max(dup[3],x[3]);continue}out.push(x)}

  return res.sort((a,b)=>a[0]-b[0]);

   con la fuerza de su mano. El tiempo lo lleva la mano del escenario, así la banda nunca se desarma.
   Quien canta lo hace por el micrófono de su teléfono: la voz viaja por wifi al escenario, pasa por sus efectos

function ivStick(p){const c=IV_PC[p];if(!c)return;const v=document.getElementById('instView');if(!v||v.dataset.k!=='d')return;
  let h=p==='h'||p==='c'||p==='s'||p==='t1'?'L':'R';if(p==='sp')h=STK.L.t0>STK.R.t0?'R':'L';
  const now=performance.now();if(now-STK[h].t0<70){const o=h==='L'?'R':'L';if(now-STK[o].t0>70)h=o}   // si esa mano recién golpeó, golpea la otra
  const k=STK[h];k.from=k.tip.slice();k.liftFrom=k.lift;k.to=[c[0]+(Math.random()-.5)*16,c[1]+(Math.random()-.5)*12];k.t0=now;if(!STK.raf)STK.raf=requestAnimationFrame(ivStickTick)}

  ['L','R'].forEach(h=>{const k=STK[h],el=v.querySelector(`.ivStk[data-h="${h}"]`);if(!el)return;
    if(k.to){const t=now-k.t0;if(t<55){const f=t/55;k.tip=[k.from[0]+(k.to[0]-k.from[0])*f,k.from[1]+(k.to[1]-k.from[1])*f];k.lift=k.liftFrom*(1-f)}
