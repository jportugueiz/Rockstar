<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon192.png"><meta name="theme-color" content="#0b0a0a"><style>html,body{margin:0;padding:0;height:100%}</style></head><body><meta charset="utf-8">
<title>Rockstar App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Diapasón a lo ancho, teclas de acorde grandes del lado de la mano que arma acordes; barras finas arriba y abajo */
:root{
  --bg:#0b0a0a; --panel:#161414; --raise:#211e1d; --line:#2e2a28;
  --fg:#f4f1ec; --muted:#9b948d; --dim:#6a635d;
  --gold:#e3b86e; --gold2:#b8843f; --wine:#6b2b2b; --stage:#e8508a;
  --accent:var(--gold);
  --f-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Instrument Sans',system-ui,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --f-show:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --keysw:clamp(190px,27vw,340px);
  color-scheme:dark;
}
[hidden]{display:none!important}
.folder{grid-column:1/-1;border:1px solid var(--line);border-radius:14px;padding:6px 10px;background:var(--panel)}.folder>summary{cursor:pointer;font-weight:700;padding:8px 2px;list-style:none}.folder>summary small{color:var(--muted);font-weight:500}.folder[open]>summary{margin-bottom:6px}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:#060505;color:var(--fg);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#app{position:relative;z-index:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;height:100%;max-width:1500px;margin:0 auto;display:grid;
  grid-template-columns:minmax(0,1fr) var(--keysw);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "board keys" "bottom keys";gap:8px 14px;
  padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px));padding-block:8px 10px}
body.lefty #app{grid-template-columns:var(--keysw) minmax(0,1fr);grid-template-areas:"top top" "keys board" "keys bottom"}

/* Barra superior */
.top{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;min-height:52px}
.left{display:flex;align-items:center;gap:12px;min-width:0}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--fg)}
.ib:hover{background:var(--panel)}
.ib svg{width:24px;height:24px}
.ib[aria-pressed="true"]{color:var(--gold)}
.ib[aria-pressed="true"] svg .fillme{fill:var(--gold)}
#recBtn[aria-pressed="true"] .dot{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#bandBtn[aria-pressed="true"]{background:color-mix(in srgb,var(--gold) 16%,transparent)}
.song{min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.song b{font-family:var(--f-show);font-weight:800;font-size:25px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{display:flex;flex-direction:column;align-items:center;min-width:0}
.bigchord{font-family:var(--f-show);font-weight:900;font-size:clamp(40px,11vh,78px);line-height:.92;letter-spacing:.01em;white-space:nowrap;background:linear-gradient(180deg,#fff6e2 10%,#f0c77e 55%,#b9833c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(227,184,110,.35)) drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.bigchord .q{color:transparent}
.pos{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:2px}
.tools{display:flex;justify-content:flex-end;gap:2px}
.beats{display:flex;gap:6px;margin-top:5px;height:9px;align-items:center}
.beats i{width:9px;height:9px;border-radius:50%;background:#3d3835;transition:background .1s}
.beats i.on{background:var(--gold)}
.beats.due i{background:var(--gold);box-shadow:0 0 8px rgba(227,184,110,.8)}
.beats em{font-style:normal;font-size:12px;color:var(--gold);margin-left:4px;font-weight:600}
.key.next.ready{animation:ready .9s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 2px rgba(227,184,110,.5),0 0 48px rgba(227,184,110,.6);filter:brightness(1.2)}}
.right{display:flex;gap:8px;align-items:center;min-width:0}
.pill[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,#121010)}
#autoBtn{padding:0 14px}
#autoBtn,#instBtn,.pager{flex:none}
.right{flex:1 1 auto;justify-content:flex-end}
#chordBtn{min-width:0;flex:0 1 auto}
@media (max-width:980px){.modename{display:none}.pill{gap:8px}}
#autoBtn svg{width:22px;height:22px}

/* Diapasón (superficie de rasgueo) */
.board{grid-area:board;position:relative;border-radius:4px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:150px;box-shadow:0 12px 34px rgba(0,0,0,.7),0 0 46px rgba(227,184,110,.07)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:12px;right:12px;bottom:8px;text-align:center;font-size:12.5px;color:#f4f1ec;pointer-events:none;transition:opacity .6s;text-shadow:0 1px 4px #000}
.hint.gone{opacity:0}
.songbar{position:absolute;left:6px;right:6px;top:5px;height:6px;display:flex;gap:3px;pointer-events:none;z-index:2}
.songbar i{flex:var(--w) 1 0;border-radius:3px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
.songbar i b{position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--gold)}
#nextBtn.goNow{background:#c81e32!important;border-color:#ff5a6a!important;color:#fff!important;box-shadow:0 0 0 3px rgba(255,70,90,.45),0 0 28px rgba(255,40,60,.75)!important;animation:goP .8s ease-in-out infinite}#nextBtn.goNow.wait{animation-duration:.45s}#nextBtn.goNow *{color:#fff!important}@keyframes goP{50%{box-shadow:0 0 0 7px rgba(255,70,90,.15),0 0 40px rgba(255,40,60,.95)}}
.bandPill{flex:none;height:40px;padding:0 14px 0 10px;margin-right:6px;border-radius:999px;border:1px solid rgba(255,190,110,.6);background:linear-gradient(135deg,#ff6a3d,#e0475e 55%,#b0306a);color:#fff;font:800 15px system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(224,71,94,.45);white-space:nowrap;cursor:pointer}
.bandPill .bpIc{font-size:19px;line-height:1}.bandPill .bpDot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.bandPill[aria-pressed="true"]{background:linear-gradient(135deg,#ffb347,#ff6a3d 55%,#e0475e);animation:bpGlow 1.6s ease-in-out infinite}.bandPill[aria-pressed="true"] .bpDot{background:#5cff8a;box-shadow:0 0 8px #5cff8a}
@keyframes bpGlow{50%{box-shadow:0 4px 24px rgba(255,140,60,.8)}}
#bandBtn.bandPill[aria-pressed="true"]{background:linear-gradient(135deg,#ffb347,#ff6a3d 55%,#e0475e)}
.slist{display:flex;flex-direction:column;gap:6px}.slist .folder .slist{margin-top:6px}.card.scard{flex-direction:row;align-items:center;gap:6px;padding:0;border-radius:12px}.card.scard[aria-current="true"]{border-color:var(--gold)}.scard .sopen{flex:1;min-width:0;text-align:left;background:none;border:0;color:inherit;padding:12px 4px 12px 14px;display:flex;flex-direction:column;gap:2px;font:inherit;cursor:pointer}.scard .sopen b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scard .sopen small{opacity:.75}.card.scard .star{position:static;flex:none;padding:10px 12px}.scard .sdel{flex:none;margin-right:8px;padding:6px 10px}
#hrecBtn[hidden]{display:none!important}#hrecBtn.on{background:#d8324a!important;animation:hrp 1.2s infinite}@keyframes hrp{50%{opacity:.7}}
.sectoast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:clamp(30px,10vh,64px);font-weight:700;color:#f4f1ec;text-shadow:0 2px 14px #000,0 0 4px #000;pointer-events:none;opacity:0;transition:opacity .7s;white-space:nowrap;z-index:2}
.sectoast.show{opacity:.95;transition:opacity .08s}

/* Teclas de acorde */
.keys{grid-area:keys;display:grid;grid-template-columns:42fr 58fr;gap:10px;min-height:0}
body.lefty .keys{grid-template-columns:58fr 42fr}
body.lefty #nextBtn{order:-1}
.key{position:relative;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--fg);touch-action:manipulation;transition:transform .08s,filter .12s;min-height:0;padding:10px 6px}
.key svg{width:clamp(34px,7vh,52px);height:clamp(34px,7vh,52px)}
.key .lbl{position:absolute;bottom:clamp(14px,6vh,34px);left:0;right:0;text-align:center;display:flex;flex-direction:column;gap:2px}
.key .lbl span{font-size:15px}
.key .lbl b{font-size:15px;font-weight:600;color:var(--gold);min-height:1.2em}
.key.prev{margin-block:18px 40px;background:linear-gradient(180deg,#1c1919,#0e0d0d);border:1.5px solid var(--wine);color:#d9d3cc}
.key.prev .lbl span{color:var(--muted)}
.key.next{background:linear-gradient(180deg,#5e4527 0%,#2b2116 42%,#151110 100%);border:2px solid var(--gold);box-shadow:0 0 0 1px rgba(227,184,110,.18),0 0 28px rgba(227,184,110,.22),inset 0 1px 0 rgba(255,255,255,.14)}
.key.next .lbl b{color:#fff3dc}
.key:active,.key.hit{transform:scale(.975);filter:brightness(1.3)}
.key[aria-disabled="true"]{opacity:.45}

/* Barra inferior */
.bottom{grid-area:bottom;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px}
.pill{display:flex;align-items:center;gap:12px;height:46px;padding:0 16px 0 14px;border-radius:999px;background:#121010;border:1px solid var(--line);min-width:0}
.pill svg{width:26px;height:26px;flex:none}
.pill .chev{width:16px;height:16px;color:var(--muted)}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
#chordPill{font-weight:600;font-size:17px}
.pager{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:4px}
.dots button{width:22px;height:30px;display:grid;place-items:center}
.dots button i{width:9px;height:9px;border-radius:50%;background:#3d3835;transition:background .2s}
.dots button[aria-selected="true"] i{background:#f4f1ec}
.modename{font-size:13px;color:var(--muted);min-width:64px}

@media (orientation:portrait){
  #app,body.lefty #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 140px auto;grid-template-areas:"top" "board" "keys" "bottom"}
  .key.prev{margin-block:10px}
  .song b{font-size:15px}.song span{font-size:12px}
}
@media (max-width:700px){.modename{display:none}.pill{padding:0 12px}.pill .chev{display:none}.tools .ib{width:38px}}

/* Hojas */
#micBtn[aria-pressed="true"]{background:color-mix(in srgb,var(--stage) 30%,transparent);box-shadow:0 0 0 2px var(--stage)}
.ivLab{position:absolute;left:10px;bottom:8px;font:600 12px var(--f-ui);color:var(--gold);background:rgba(0,0,0,.45);padding:3px 8px;border-radius:8px;pointer-events:none}.sgPad.iv{position:relative}
.instView.full{position:fixed;inset:0;z-index:12;background:#2a1b12;touch-action:none}.instView.full .ivSvg{position:absolute;left:0;right:0;top:52px;bottom:0;width:100%;height:calc(100% - 52px)}
.ivBar{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));background:linear-gradient(#0d0b0a,#16110e);border-bottom:1px solid rgba(227,184,110,.25);z-index:2}
.ivB{flex:none;height:38px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:#2a2420;color:#f4efe6;font:700 14px system-ui,sans-serif}.ivB.ivNext{background:#3a2f22;border-color:var(--gold)}.ivB.goNow{background:#c81e32;border-color:#ff5a6a;animation:goP .8s infinite}
.ivT{flex:1;min-width:0;font:700 15px system-ui,sans-serif;color:#f4efe6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instView.full .ivLab{bottom:10px}
.ivTx{font:700 13px system-ui,sans-serif;fill:#f1dfb0;letter-spacing:2px;opacity:.75}
.ivMove{transform-box:fill-box;transform-origin:center}
.ivCym.hit .ivMove{animation:cymW 1.25s cubic-bezier(.2,.6,.3,1)}@keyframes cymW{0%{transform:none}8%{transform:rotate(-7deg) scale(.95,1.03)}25%{transform:rotate(5deg) scale(1.03,.97)}45%{transform:rotate(-3deg) scale(.985,1.015)}65%{transform:rotate(1.5deg)}100%{transform:none}}
.ivP.hit .ivHi{animation:ivHiF .45s ease-out}@keyframes ivHiF{0%{opacity:.5}100%{opacity:0}}
.ivDr.hit .ivMove{animation:drH .24s}@keyframes drH{30%{transform:scale(.955)}100%{transform:none}}
.ivKey .ivMove{transform-box:view-box;transform-origin:50% 0}.ivKey.hit .ivMove{animation:kyH .28s}@keyframes kyH{20%{transform:translateY(6px);filter:brightness(.88)}100%{transform:none}}
.ivStr .ivMove{transform-box:fill-box;transform-origin:center}.ivStr.vib .ivMove{animation:stV .7s linear}@keyframes stV{0%{transform:none}8%{transform:translateY(3px)}16%{transform:translateY(-3px)}24%{transform:translateY(2.4px)}32%{transform:translateY(-2px)}42%{transform:translateY(1.5px)}52%{transform:translateY(-1.1px)}64%{transform:translateY(.7px)}78%{transform:translateY(-.4px)}100%{transform:none}}
.instView{position:absolute;inset:0;z-index:3;background:#120f0e;touch-action:none;user-select:none;-webkit-user-select:none}.instView.pass{pointer-events:none}
.ivSvg{width:100%;height:100%;display:block}.ivHi{transition:opacity .18s}.ivKey.on .ivHi{opacity:.42;transition:none}.ivDrum.on .ivHi{opacity:.45;transition:none}.ivDrum.on{transform-box:fill-box;transform-origin:center;animation:ivHit .14s}@keyframes ivHit{50%{transform:scale(.97)}}
.instView.flash,.sgPad.flash{animation:ivFlash .16s ease-out}@keyframes ivFlash{from{filter:brightness(1.5)}to{filter:none}}
.sgPad.iv{padding:0;overflow:hidden}.sgPad.iv .ivSvg{border-radius:20px}
#sesGuest{position:fixed;inset:0;z-index:30;background:#0b0a0a;display:flex;flex-direction:column;gap:12px;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow-y:auto}
.sgTop{display:flex;justify-content:space-between;align-items:center}
.sgNow{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.sgNow b{font-size:17px}.sgNow small{color:var(--muted)}
.sgInst{flex-wrap:wrap}
.sgPad{flex:1;min-height:260px;border-radius:22px;border:1px solid var(--gold2);background:radial-gradient(circle at 50% 40%,#2a2118,#120f0d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.sgPad span{font-size:64px;line-height:1}.sgPad b{font-family:var(--f-show);font-size:34px;text-transform:uppercase;letter-spacing:.04em}.sgPad small{color:var(--muted);max-width:28ch}
.sgPad.hit{animation:sgHit .18s ease-out}@keyframes sgHit{from{box-shadow:0 0 0 6px rgba(227,184,110,.45);background:#3a2c1c}to{box-shadow:none}}
.sgMic{display:flex;flex-direction:column;gap:8px}.sgMic small{color:var(--muted)}
.sesCode{font-family:var(--f-show);font-size:56px;letter-spacing:.25em;text-align:center;color:var(--gold);padding:6px 0;border:1px dashed var(--gold2);border-radius:14px}
#sheetWrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:relative;width:min(760px,100%);max-height:92%;display:flex;flex-direction:column;background:#141212;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.sheet h2{margin:0;font-family:var(--f-show);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.03em}
#sheetBody{overflow-y:auto;padding:4px 18px 22px;display:flex;flex-direction:column;gap:18px}
#sheetBody>*{flex-shrink:0}   /* sin esto las listas del menú se aplastaban hasta desaparecer */
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item[aria-current="true"]{background:var(--raise);box-shadow:inset 3px 0 0 var(--gold)}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.item .main b{font-weight:600}
.item .main small{color:var(--muted);font-size:12.5px}
.item .go{color:var(--muted);font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line);text-align:left;position:relative}
.card[aria-current="true"]{border-color:var(--gold)}
.card b{font-size:17px;font-weight:600;padding-right:34px}
.card small{color:var(--muted)}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.card .star{position:absolute;top:8px;right:8px}
.card .playbtn{margin-top:6px;align-self:flex-start}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.star{font-size:20px;color:var(--dim);padding:4px 6px;line-height:1}
.star[aria-pressed="true"]{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.preset{padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:left;font-weight:600}
.preset small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.preset[aria-pressed="true"]{border-color:var(--gold);background:var(--raise)}
.fx{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--bg);border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx .head{display:flex;align-items:center;gap:10px}
.fx .head .main{flex:1;min-width:0}
.fx .head .main small{display:block;color:var(--muted);font-size:12px}
input[type=range]{width:100%;accent-color:var(--gold)}
.toggle{display:flex;align-items:center;gap:8px;padding:2px;border-radius:12px;flex:none}
.toggle::before{content:"";width:40px;height:24px;flex:none;border-radius:12px;background:#3a3532;transition:background .15s;background-image:radial-gradient(circle at 12px 12px,#f4f1ec 8.5px,transparent 9px)}
.toggle[aria-pressed="true"]::before{background-color:var(--gold);background-image:radial-gradient(circle at 28px 12px,#1a1410 8.5px,transparent 9px)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 8px;border-radius:8px;color:var(--muted);font-weight:500;min-width:max-content}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 -2px 0 var(--gold)}
.seg button small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.keyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.keyrow b{font-size:28px;font-weight:600;min-width:64px;text-align:center}
.chart{display:flex;flex-direction:column;gap:10px}
.chart .sec{display:flex;flex-direction:column;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.pad{padding:8px 11px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-weight:600;min-width:44px}
.chips button[aria-current="true"],.pad[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--raise)}
.pchip{display:flex;align-items:center;border-radius:9px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.pchip button{padding:8px 11px;font-weight:600}
.pchip button.x{color:var(--dim);border-left:1px solid var(--line);padding:8px 9px}
.pchip.cur{border-color:var(--gold)}
.ghost{padding:8px 12px;border-radius:9px;border:1px dashed var(--line);color:var(--muted)}
.save{display:flex;gap:8px}
.field{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{padding:10px 16px;border-radius:11px;background:var(--gold);color:#1a1410;font-weight:600;flex:none}
.btn.big{padding:14px 18px;font-size:16px;width:100%}
.btn.quiet{background:var(--raise);color:var(--fg);border:1px solid var(--line)}
.setting{display:flex;flex-direction:column;gap:6px}
.setting label{display:flex;justify-content:space-between;font-size:14px}
.setting label span{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.meter{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.meter b{color:var(--fg);font-weight:500}
.p{margin:0;color:var(--muted);line-height:1.5;max-width:64ch;font-size:14px}
.rec{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec audio{width:100%;height:36px}
.rec .head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.calbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:6px;align-items:center;padding:6px 6px 6px 14px;border-radius:14px;background:rgba(12,10,10,.88);border:1px solid var(--gold);box-shadow:0 6px 24px rgba(0,0,0,.6);white-space:nowrap;max-width:calc(100% - 20px);overflow-x:auto}
.calbar span{font-size:13px;color:var(--fg);margin-right:4px}
.calbar button{padding:7px 11px;border-radius:9px;background:var(--raise);border:1px solid var(--line);font-size:13px;font-weight:600}
.calbar button.on{background:var(--gold);color:#1a1410;border-color:var(--gold)}
.tabin{width:100%;min-height:170px;font-family:var(--f-mono);font-size:12.5px;line-height:1.35;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);white-space:pre;overflow:auto;resize:vertical}
.prev{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.5}
.prev b{color:var(--gold);font-weight:500}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--bg)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.field{flex:none;padding:7px 8px;font-size:13px}
.part{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line)}
.part:first-child{border-top:0}
.part .main b{font-weight:600}.part .main small{display:block;color:var(--muted);font-size:12.5px}
.part input{grid-column:2}

/* Aviso de giro */
#rotate{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#rotate h2{margin:0;font-weight:700;font-size:26px}
.phone{width:58px;height:100px;border:3px solid var(--fg);border-radius:12px;position:relative;animation:turn 2.4s ease-in-out infinite}
.phone::after{content:"";position:absolute;left:50%;bottom:6px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--fg)}
@keyframes turn{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function ksBuffer(midi,I){
  const sr=ctx.sampleRate,p=I.ks,freq=440*Math.pow(2,(midi-69)/12);
  const len=Math.floor(sr*p.dur*(midi>76?.7:1)),out=new Float32Array(len);
  const Sx=.5+.47*p.loop,D=sr/freq-(1-Sx),N=Math.floor(D),fr=D-N;
  const g=Math.pow(.001,1/(freq*p.t60*(freq<150?1.3:1)));
  const exc=new Float32Array(N);let lp=0;const c=.2+.75*p.bright;
  for(let i=0;i<N;i++){lp+=c*((Math.random()*2-1)-lp);exc[i]=lp}
  const P=Math.max(1,Math.round(p.pick*N));for(let i=N-1;i>=P;i--)exc[i]-=exc[i-P];
  let mean=0,mx=0;for(let i=0;i<N;i++)mean+=exc[i];mean/=N;for(let i=0;i<N;i++){exc[i]-=mean;mx=Math.max(mx,Math.abs(exc[i]))}
  const nrm=.8/(mx||1);let prev=0;
  for(let n=0;n<len;n++){let v=0;const a=n-N;if(a>=0){const d=(1-fr)*out[a]+fr*(a>0?out[a-1]:0);v=g*(Sx*d+(1-Sx)*prev);prev=d}out[n]=(n<N?exc[n]*nrm:0)+v}
  const fade=Math.floor(sr*.08);for(let i=0;i<fade;i++)out[len-1-i]*=i/fade;
  const b=ctx.createBuffer(1,len,sr);b.getChannelData(0).set(out);return b;
}

/* ───────── Lector de tablaturas (ASCII) → solo por tiempos ───────── */
function parseTab(txt,upb){
  const out={notes:0,beats:[],bends:0,vibs:0,first:'',firstMidi:64};
  if(!txt||!txt.trim())return out;
  const lines=String(txt).replace(/\t/g,'    ').split(/\r?\n/);
  const isTab=l=>(l.match(/-/g)||[]).length>=4&&/^\s*[A-Ga-g]?[#b]?\s*[|:]?[-0-9hpbrv~\/\\|x()\s]*$/.test(l)&&/[-]{2}/.test(l);
  const blocks=[];let cur=[];
  const flush=()=>{for(let i=0;i+6<=cur.length;i+=6)blocks.push(cur.slice(i,i+6));cur=[]};
  lines.forEach(l=>{if(isTab(l))cur.push(l);else flush()});flush();
  if(!blocks.length)return out;
  const ev=[];let off=0;
  blocks.forEach(b=>{
    const rows=b.map(l=>l.replace(/^\s*[A-Ga-g]?[#b]?\s*/,'').replace(/^[|:]/,''));
    const W=Math.max(...rows.map(r=>r.length));
    rows.forEach((row,r)=>{const str=5-r;
      for(let c=0;c<row.length;c++){const ch=row[c];if(!/[0-9]/.test(ch))continue;
        let n=ch,c2=c;if(/[0-9]/.test(row[c+1]||'')&&+(ch+row[c+1])<=24){n=ch+row[c+1];c2=c+1}
        let art,k=c2+1;const t=row[k]||'';
        if(t==='b'){art='b';k++;while(/[0-9]/.test(row[k]||''))k++;if(row[k]==='r'){k++;while(/[0-9]/.test(row[k]||''))k++}}
        else if(t==='~'||t==='v')art='v';
        const prev=row[c-1]||'';if(prev==='h'||prev==='p'||prev==='/'||prev==='\\')art=art||'h';
        ev.push({col:off+c,midi:TUNING[str]+(+n),art});c=Math.max(c2,k-1);
      }});
    off+=W+2;
  });
  if(!ev.length)return out;
  const byCol=new Map(),allCol=new Map();ev.forEach(e=>{const o=byCol.get(e.col);if(!o||e.midi>o.midi)byCol.set(e.col,e);if(!allCol.has(e.col))allCol.set(e.col,[]);allCol.get(e.col).push(e)});
  const notes=[...byCol.values()].sort((a,b)=>a.col-b.col);
  const gaps=[];for(let i=1;i<notes.length;i++)gaps.push(notes[i].col-notes[i-1].col);
  const sg=gaps.slice().sort((a,b)=>a-b),unit=Math.max(1,sg.length?sg[Math.floor(sg.length*.25)]:2);
  let pos=0;const units=notes.map((n,i)=>{const p=pos;pos+=i<gaps.length?clamp(Math.round(gaps[i]/unit),1,8):2;return p});
  const per=upb==='auto'?2:+upb;
  out.events=notes.map((n,i)=>({pos:units[i]/per,midis:[...new Set(allCol.get(n.col).map(e=>e.midi))].sort((a,b)=>a-b),art:n.art,dur:((i+1<notes.length?units[i+1]:pos)-units[i])/per}));
  const nb=Math.ceil((pos+.001)/per),beats=[];
  for(let b=0;b<nb;b++){
    const inBeat=notes.map((n,i)=>({n,u:units[i]})).filter(x=>x.u>=b*per&&x.u<(b+1)*per);
    if(!inBeat.length){beats.push('-');continue}
    const slots=new Array(per).fill(null);inBeat.forEach(x=>{slots[x.u-b*per]=x.n});
    const toks=[];let firstSet=false;slots.forEach(n=>{if(n){toks.push(n.midi+(n.art||''));firstSet=true}else if(firstSet)toks.push('-')});
    while(toks.length&&toks[toks.length-1]==='-')toks.pop();
    beats.push(toks.filter(t=>t!=='-').length===toks.length?toks.join(' '):toks.filter(t=>t!=='-').join(' '));
  }
  out.notes=notes.length;out.beats=beats;out.bends=notes.filter(n=>n.art==='b').length;out.vibs=notes.filter(n=>n.art==='v').length;
  out.firstMidi=notes[0].midi;out.first=notes.slice(0,8).map(n=>noteName(n.midi)+(n.art==='b'?'↑':n.art==='v'?'~':'')).join(' ');
  return out;
}

function parseMusicXML(txt){
  const out={notes:0,beats:[],bends:0,vibs:0,first:'',firstMidi:64,events:[]};
  let doc;try{doc=new DOMParser().parseFromString(txt,'application/xml')}catch(e){return out}
  const part=doc.querySelector('part');if(!part)return out;
  const STEP={C:0,D:2,E:4,F:5,G:7,A:9,B:11},evs=[];let div=1,pos=0,oct=0,chroma=0,lastStart=0;
  const num=(el,q)=>{const x=el.querySelector(q);return x?+x.textContent||0:0};
  part.querySelectorAll('measure').forEach(m=>{[...m.children].forEach(el=>{
    const tg=el.tagName;
    if(tg==='attributes'){const d=num(el,'divisions');if(d)div=d;if(el.querySelector('transpose')){oct=num(el,'transpose octave-change');chroma=num(el,'transpose chromatic')}}
    else if(tg==='backup')pos-=num(el,'duration')/div;
    else if(tg==='forward')pos+=num(el,'duration')/div;
    else if(tg==='note'){
      if(el.querySelector('grace'))return;
      const dur=num(el,'duration')/div,isChord=!!el.querySelector('chord'),start=isChord?lastStart:pos;
      if(!isChord){lastStart=pos;pos+=dur}
      if(el.querySelector('rest'))return;
      if(el.querySelector('tie[type="stop"]')&&!el.querySelector('tie[type="start"]')){const l=evs[evs.length-1];if(l)l.dur+=dur;return}
      let midi;const sf=el.querySelector('technical string'),fr=el.querySelector('technical fret');
      if(sf&&fr)midi=TUNING[6-(+sf.textContent)]+(+fr.textContent);
      else{const pt=el.querySelector('pitch');if(!pt)return;midi=(num(pt,'octave')+1)*12+STEP[(pt.querySelector('step')||{}).textContent]+num(pt,'alter')+chroma+oct*12}
      if(!isFinite(midi))return;
      let art;if(el.querySelector('technical bend'))art='b';else if(el.querySelector('hammer-on,pull-off,slide,glissando'))art='h';else if(el.querySelector('wavy-line,vibrato'))art='v';
      const last=evs[evs.length-1];
      if(isChord&&last&&Math.abs(last.pos-start)<1e-6)last.midis.push(midi);else evs.push({pos:start,midis:[midi],art,dur});
    }})});
  evs.sort((a,b)=>a.pos-b.pos);if(!evs.length)return out;
  const p0=evs[0].pos<0?evs[0].pos:0;evs.forEach(e=>{e.pos-=p0;e.midis.sort((a,b)=>a-b)});
  out.events=evs;out.notes=evs.length;out.bends=evs.filter(e=>e.art==='b').length;out.vibs=evs.filter(e=>e.art==='v').length;
  out.firstMidi=evs[0].midis[evs[0].midis.length-1];out.first=evs.slice(0,8).map(e=>noteName(e.midis[e.midis.length-1])+(e.midis.length>1?'+':'')).join(' ');
  out.beats=eventsToBeats(evs);return out;
}
function eventsToBeats(evs){
  const last=evs[evs.length-1],nb=Math.ceil(last.pos+Math.max(1,last.dur||1)-1e-6),beats=[];
  for(let b=0;b<nb;b++){const inb=evs.filter(e=>e.pos>=b-1e-6&&e.pos<b+1-1e-6);if(!inb.length){beats.push('-');continue}
    const tri=inb.some(e=>{const f=e.pos-b;return Math.abs(f-1/3)<.06||Math.abs(f-2/3)<.06}),n=tri?3:4,sl=new Array(n).fill('-');
    inb.forEach(e=>{const k=clamp(Math.round((e.pos-b)*n),0,n-1);sl[k]=e.midis[e.midis.length-1]+(e.art||'')});
    while(sl.length>1&&sl[sl.length-1]==='-')sl.pop();beats.push(sl.join(' '))}
  return beats;
}
function analyzeImport(txt,upb){return /<score-partwise|<score-timewise/.test(txt||'')?parseMusicXML(txt):parseTab(txt,upb)}

let pdfjsReady=null;
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function loadPdfJs(){
  if(!pdfjsReady)pdfjsReady=(async()=>{const b='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    await loadScript(b+'pdf.min.js');await loadScript(b+'pdf.worker.min.js');
    const lib=window['pdfjs-dist/build/pdf']||window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=b+'pdf.worker.min.js';return lib})();

async function pdfToText(file){
  const lib=await loadPdfJs(),pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise,out=[];
  for(let n=1;n<=pdf.numPages;n++){
    const tc=await (await pdf.getPage(n)).getTextContent(),rows=[];
    tc.items.forEach(it=>{if(!it.str)return;const y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<=2);if(!r){r={y,its:[]};rows.push(r)}r.its.push({x:it.transform[4],w:it.width,s:it.str})});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{r.its.sort((a,b)=>a.x-b.x);const cw=r.its.reduce((a,i)=>a+i.w/Math.max(1,i.s.length),0)/r.its.length||5;let line='',end=null;
      r.its.forEach(i=>{if(end!=null){const g=Math.round((i.x-end)/cw);if(g>0)line+=' '.repeat(g)}line+=i.s;end=i.x+i.w});out.push(line)});
  }
  return out.join('\n');
}
const normW=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>=2);

    const hit=tw.filter(w=>fw.some(f=>f===w||(f.length>=4&&(w.startsWith(f)||f.startsWith(w))))).length;
    const sc=hit/tw.length+(sg.zone==='solos'?0:.01);if(hit===tw.length&&sc>bs){bs=sc;best=sg}});

}

/* ───────── Motor fogata: la guitarra original en pedazos, disparada por tu mano ─────────
   La guitarra queda precargada en memoria. Se corta en pedazos en sus ataques reales; cada golpe tuyo
   (abajo o arriba) dispara el siguiente. La app aprende si vas a 1x, 2x, 3x o 4x del pulso, se adelanta a
   tus golpes cuando vas parejo (para tapar el retraso del parlante) y sostiene la cuerda entre golpes. */

async function slPrepare(){

  if(origMode()==='notas'){try{const r=await odbGet(id+'|notes');if(!r)throw 0;SL.allNotes=bpRefine(r.notes);FL.on=false;slApplyLevel();SL.buf='notes';SL.id=id;
      SL.pos=Math.max(0,origBeatAt(o.beats,Math.max(0,SL.notes[0][0]-.02)));FL.p=SL.pos;FL.idx=0;render()}catch(e){flashMsg('No encontré las notas aprendidas')}finally{SL.prep=false}return}
  try{ensureAudio();const r=await odbGet(oKey(id,'gtr'));if(!r)return;
    const ab=await ctx.decodeAudioData(await r.blob.arrayBuffer());
    const L=ab.length,m=ctx.createBuffer(1,L,ab.sampleRate),d=m.getChannelData(0);
    for(let c=0;c<ab.numberOfChannels;c++){const x=ab.getChannelData(c);for(let i=0;i<L;i++)d[i]+=x[i]/ab.numberOfChannels}

// el corte más cercano a un ataque real dentro de una ventana

/* ───────── Modo notas: tu mano solo marca el tempo; la guitarra toca las notas en su ritmo original ─────────
   Rasguear abajo y arriba no hace sonar nada por sí mismo: la app mide tu pulso (1x, 2x, 3x…), lo sigue suave
   y la guitarra va tocando exactamente lo que toca la canción, a tu velocidad. Si paras, la guitarra se detiene. */

/* ───────── Golpe a golpe: cada pasada de la mano (abajo o arriba) toca UN paso de la canción ─────────

function flowStroke(vel){
  ensureAudio();const now=ctx.currentTime,L=slLat(),o=origs[S.songId];vel=clamp(vel==null?.7:vel,.25,1);
  const dt=FL.last?now-FL.last:null,per=SL.iv&&SL.iv.length>=3?slPeriod():null;
  if(per&&dt!=null&&dt<per*.45)return;                 // golpe de más: no cambia nada

  FL.last=now;FL.vel=FL.vel*.7+vel*.3;SL.last=now;slLearn(dt);SL.on=true;

  if(!FL.on){FL.on=true;FL.t0=now;FL.r=songR;FL.idx=0;while(FL.idx<SL.nB.length&&SL.nB[FL.idx]<FL.p-.01)FL.idx++;

function slAlive(){clearTimeout(SL.stopT);const med=SL.iv.length>=3?slPeriod():.5;SL.stopT=setTimeout(()=>{SL.on=false;render()},Math.max(1500,med*4000));origRender()}

// si vas parejo, la app lanza los próximos pedazos un poco antes, justo lo que tarda tu parlante,

/* ───────── La app aprende las notas de la guitarra (Basic Pitch de Spotify, Apache-2.0, corriendo aquí mismo) ───────── */
/* Decodificador de notas: mismo algoritmo que basic-pitch (output_to_notes_polyphonic), versión rápida */
// Versión rápida (mismo algoritmo que basic-pitch output_to_notes_polyphonic) con arreglos planos y montículo
function bpFastNotes(Fr,On,nT,onsetThresh,frameThresh,minLen,energyTol){
  const P=88,MAXF=87,fr=Fr,on=new Float32Array(On);
  // inferir ataques por subidas en la energía
  const diff=new Float32Array(nT*P);let dmax=0,omax=0;

  // (filas 0 y 1: el original rellena con ceros antes de restar; replicamos)
  for(let p=0;p<P;p++){if(nT>1){}}
  if(dmax>0)for(let i=0;i<nT*P;i++){const v=omax*diff[i]/dmax;if(v>on[i])on[i]=v}
  const rem=new Float32Array(fr),notes=[];

  const peaks=[];for(let t=1;t<nT-1;t++)for(let p=0;p<P;p++){const i=t*P+p,v=on[i];if(v>=onsetThresh&&v>on[i-P]&&v>on[i+P])peaks.push(i)}
  for(let q=peaks.length-1;q>=0;q--){const t0=(peaks[q]/P)|0,f=peaks[q]%P;if(t0>=nT-1)continue;
    let i=t0+1,k=0;while(i<nT-1&&k<energyTol){if(rem[i*P+f]<frameThresh)k++;else k=0;i++}i-=k;
    if(i-t0<=minLen)continue;let s=0;
    for(let t=t0;t<i;t++){rem[t*P+f]=0;if(f<MAXF)rem[t*P+f+1]=0;if(f>0)rem[t*P+f-1]=0;s+=fr[t*P+f]}
    notes.push([t0,i,f+21,s/(i-t0)])}

  const H=[];const push=(v,i)=>{H.push([v,i]);let c=H.length-1;while(c>0){const p=(c-1)>>1;if(H[p][0]>=H[c][0])break;[H[p],H[c]]=[H[c],H[p]];c=p}};
  const pop=()=>{const top=H[0],last=H.pop();if(H.length){H[0]=last;let c=0;for(;;){const l=2*c+1,r=l+1;let m=c;if(l<H.length&&H[l][0]>H[m][0])m=l;if(r<H.length&&H[r][0]>H[m][0])m=r;if(m===c)break;[H[m],H[c]]=[H[c],H[m]];c=m}}return top};

  while(H.length){const [v,idx]=pop();if(rem[idx]!==v||v<=frameThresh)continue;
    const tm=(idx/P)|0,f=idx%P;rem[idx]=0;
    let i=tm+1,k=0;while(i<nT-1&&k<energyTol){const j=i*P+f;if(rem[j]<frameThresh)k++;else k=0;rem[j]=0;if(f<MAXF)rem[j+1]=0;if(f>0)rem[j-1]=0;i++}
    const iEnd=i-1-k;
    i=tm-1;k=0;while(i>0&&k<energyTol){const j=i*P+f;if(rem[j]<frameThresh)k++;else k=0;rem[j]=0;if(f<MAXF)rem[j+1]=0;if(f>0)rem[j-1]=0;i--}
    const iStart=i+1+k;if(iEnd-iStart<=minLen)continue;
    let s=0;for(let t=iStart;t<iEnd;t++)s+=fr[t*P+f];notes.push([iStart,iEnd,f+21,s/(iEnd-iStart)])}
  // de cuadros a segundos (igual que el original)
  const FPS=Math.floor(22050/256),NF=FPS*2,NS=22050*2-256,WO=(256/22050)*(NF-NS/256)+.0018,ft=x=>x*256/22050-WO*Math.floor(x/NF);
  return notes.map(([a,b,m,amp])=>({startTimeSeconds:ft(a),durationSeconds:ft(b)-ft(a),pitchMidi:m,amplitude:amp}));
}

/* ───────── Tocar con amigos: sesión ─────────
   Un teléfono es el ESCENARIO: está conectado al parlante y de él sale todo el sonido.
   Los demás entran a la sesión con un código, eligen instrumento (bajo, teclado, batería, guitarra o solo voz)
   y lo tocan con la mano, igual que la guitarra: su parte de la partitura suena en el escenario mientras la tocan,
   con la fuerza de su mano. El tiempo lo lleva la mano del escenario, así la banda nunca se desarma.
   Quien canta lo hace por el micrófono de su teléfono: la voz viaja por wifi al escenario, pasa por sus efectos
   y recién ahí sale al parlante. Los gestos viajan como "presencia" (un contador de pasadas), así no se pierden. */

/* Instalar en el teléfono: dentro de Claude se copia el link; en el navegador, Android muestra "Instalar" y iPhone se explica con 2 toques */
const INST={ev:null};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INST.ev=e;renderSheetIfOpen()});
const inFrame=()=>{try{return window.top!==window}catch(e){return true}},isIOS=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent),appURL=()=>location.origin+location.pathname;
function installSheet(body){const ios=isIOS(),inst=matchMedia('(display-mode: standalone)').matches;
  if(inst){body.innerHTML='<div class="group"><b>✅ Ya está instalada</b><small class="p" style="margin:0">La estás usando como app. Si es la primera vez, sube de nuevo tus partituras (📁).</small></div>';return}
  if(inFrame()){body.innerHTML=`<div class="group"><span class="eyebrow">Paso 1 de 2</span><b style="font-size:18px">Copia el link de la app</b>
      <button class="btn big" data-inst="copy">📋 Copiar link</button><input class="field" readonly value="${esc(appURL())}" onfocus="this.select()">
      <span class="eyebrow" style="margin-top:10px">Paso 2 de 2</span><b style="font-size:18px">Pégalo en ${ios?'Safari':'Chrome'} y ábrelo</b>
      <small class="p" style="margin:0">Ahí vuelve a abrir este mismo menú (📲 Instalar en mi teléfono) y te aparece el botón para instalarla.</small></div>`;return}
  if(INST.ev){body.innerHTML='<div class="group"><b style="font-size:18px">Un toque y listo</b><button class="btn big" data-inst="go">📲 Instalar Rockstar</button><small class="p" style="margin:0">Queda con su ícono en tu pantalla de inicio. La primera vez sube de nuevo tus partituras (📁).</small></div>';return}
  body.innerHTML=ios?`<div class="group"><b style="font-size:18px">En Safari, 2 toques:</b><small class="p" style="margin:0;font-size:16px">1. Toca el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba, abajo de la pantalla).<br>2. Elige <b>«Agregar a inicio»</b> y toca <b>Agregar</b>.</small><small class="p" style="margin:0">Después ábrela desde su ícono y sube de nuevo tus partituras (📁).</small></div>`
    :`<div class="group"><b style="font-size:18px">En Chrome, 2 toques:</b><small class="p" style="margin:0;font-size:16px">1. Toca los <b>tres puntitos ⋮</b> arriba a la derecha.<br>2. Elige <b>«Instalar app»</b> (o «Agregar a la pantalla principal»).</small><small class="p" style="margin:0">Después ábrela desde su ícono y sube de nuevo tus partituras (📁).</small></div>`}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-inst]');if(!b)return;
  if(b.dataset.inst==='go'&&INST.ev){INST.ev.prompt();INST.ev.userChoice.finally(()=>{INST.ev=null;renderSheetIfOpen()})}
  else if(b.dataset.inst==='copy'){const u=appURL();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(u):Promise.reject()).then(()=>flashMsg('✅ Link copiado. Ahora pégalo en '+(isIOS()?'Safari':'Chrome'))).catch(()=>{const i=document.querySelector('#sheetBody input[readonly]');if(i){i.focus();i.select()}flashMsg('Mantén apretado el link para copiarlo')})}});
/* Para instalarla en el teléfono ("Agregar a pantalla de inicio"): ícono, nombre y pantalla completa */
try{const h=document.head||document.documentElement,add=(t,a)=>{const e=document.createElement(t);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));h.appendChild(e)};
  if(!document.querySelector('link[rel=manifest]'))add('link',{rel:'manifest',href:'manifest.json'});add('link',{rel:'apple-touch-icon',href:'icon192.png'});add('link',{rel:'icon',href:'icon192.png'});
  add('meta',{name:'apple-mobile-web-app-capable',content:'yes'});add('meta',{name:'mobile-web-app-capable',content:'yes'});add('meta',{name:'apple-mobile-web-app-title',content:'Rockstar'});add('meta',{name:'theme-color',content:'#0b0a0a'})}catch(e){}
